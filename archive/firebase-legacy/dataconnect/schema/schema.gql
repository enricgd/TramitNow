# tramitNow - Modelo documental ETT
# Sources: Modelo_backend_tablas_ETT_TramitNOW.docx,
# Inventario_pantallas_ETT_TramitNOW (1).docx and
# tipos_de_usuarios.drawio (1).pdf.
# This is the deployable table schema. The SQL file documents supplemental
# PostgreSQL checks, update triggers and tenant RLS that SQL Connect cannot model.
# The PDF scopes are represented by roles, user_roles and user_contexts.

type Tenant @table(key: "id", name: "tenants") {
  id: UUID! @default(expr: "uuidV4()")
  code: String! @unique @col(dataType: "varchar(30)")
  legalName: String! @col(name: "legal_name", dataType: "varchar(200)")
  tradeName: String @col(name: "trade_name", dataType: "varchar(200)")
  taxId: String @unique @col(name: "tax_id", dataType: "varchar(30)")
  status: String! @default(value: "active") @col(dataType: "varchar(20)")
  defaultLocale: String @col(name: "default_locale", dataType: "varchar(10)")
  timezone: String @col(dataType: "varchar(80)")
  settings: Any @default(sql: "'{}'::jsonb")
  createdAt: Timestamp! @default(sql: "CURRENT_TIMESTAMP") @col(name: "created_at")
  updatedAt: Timestamp! @default(sql: "CURRENT_TIMESTAMP") @col(name: "updated_at")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type CatalogItem
  @table(key: "id", name: "catalog_items")
  @unique(fields: ["tenantId", "catalog", "code"])
  @index(fields: ["tenantId", "catalog"]) {
  id: UUID! @default(expr: "uuidV4()")
