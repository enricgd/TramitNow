# Se combina con el docker-compose.yml oficial de Supabase en proyecto/docker-compose.yml (ver setup.sh).
# Las rutas relativas parten de supabase/docker/, de ahí los ../../

name: tramitnow

services:
  # Desactivados para ahorrar RAM: quedan fuera del proyecto generado.
  realtime:
    profiles: [extra]
  functions:
    profiles: [extra]
  supavisor:
    profiles: [extra]

  # Único servicio expuesto a internet (puerto 443 redirigido en el router).
  caddy:
    build: ../../caddy
    image: tramitnow/caddy:local
    restart: unless-stopped
    depends_on:
      - api-gw
    ports:
      - ${CADDY_HTTPS_PORT:-443}:443
    environment:
      DOMAIN: ${DOMAIN}
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
      ACME_EMAIL: ${ACME_EMAIL}
      DEMO_USER: ${DEMO_USER}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH}
    volumes:
      - ../../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../caddy/site:/srv/demo:ro
      - caddy-data:/data
      - caddy-config:/config

  # pg_dump diario de toda la base de datos; conserva 14 días.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: ${POSTGRES_PORT}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ../../backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          pg_dump -Fc -f /backups/tramitnow-$$(date +%F).dump && echo "backup ok $$(date)"
          find /backups -name '*.dump' -mtime +14 -delete
          sleep 86400
        done

volumes:
  caddy-data:
  caddy-config:
