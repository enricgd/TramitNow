                return candidates.filter(can => {
                    // Search query
                    if (searchQuery.trim()) {
                        const q = searchQuery.toLowerCase();
                        const matchName = `${can.name} ${can.lastName}`.toLowerCase().includes(q);
                        const matchDni = can.dni.toLowerCase().includes(q);
                        const matchPhone = can.phone.toLowerCase().includes(q);
                        const matchEmail = can.email.toLowerCase().includes(q);
                        const matchCity = can.city.toLowerCase().includes(q);
                        const matchCategory = can.category.toLowerCase().includes(q);
                        const matchSkills = can.skills.some(s => s.toLowerCase().includes(q));
                        if (!matchName && !matchDni && !matchPhone && !matchEmail && !matchCity && !matchCategory && !matchSkills) {
                            return false;
                        }
                    }

                    // Preset filters
                    if (savedPreset === 'AVAILABLE_NOW' && can.status !== 'Disponible') return false;
                    if (savedPreset === 'DOC_PENDING' && (can.dniStatus === 'OK' && can.rgpdStatus === 'Vigente' && can.nssStatus === 'OK')) return false;
                    if (savedPreset === 'ASSIGNED' && can.status !== 'Asignado/En misión') return false;

                    // Status
                    if (statusFilter !== 'ALL' && can.status !== statusFilter) return false;
                    
                    // Source
                    if (sourceFilter !== 'ALL' && can.source !== sourceFilter) return false;

                    // Doc Filter
                    if (docFilter === 'DOC_OK' && (can.dniStatus !== 'OK' || can.rgpdStatus !== 'Vigente' || can.nssStatus !== 'OK')) return false;
                    if (docFilter === 'DOC_ALERT' && (can.dniStatus === 'OK' && can.nssStatus === 'OK')) return false;
                    if (docFilter === 'RGPD_ALERT' && (can.rgpdStatus === 'Vigente')) return false;

                    // Category
                    if (categoryFilter !== 'ALL' && !can.category.toLowerCase().includes(categoryFilter.toLowerCase())) return false;

                    return true;
                });
            }, [candidates, searchQuery, statusFilter, sourceFilter, docFilter, categoryFilter, savedPreset]);

            // Handlers
            const handleSelectAll = (e) => {
                if (e.target.checked) {
                    setSelectedIds(filteredCandidates.map(c => c.id));
                } else {
                    setSelectedIds([]);
                }
            };

            const handleToggleSelect = (id) => {
                setSelectedIds(prev => 
                    prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]
                );
            };

            // Start Assign Wizard for a single candidate
            const startAssignWizard = (candidate) => {
                // Pre-check blockers for default position (POS-01 on PET-2026-0048)
                const pet = petitions.find(p => p.id === 'PET-2026-0048');
                const pos = pet?.positions[0];
                
                const blockers = [];
                const warnings = [];

                if (candidate.dniStatus === 'Caducado') {
                    blockers.push(`Documento de identidad CADUCADO (${candidate.dni}). Requiere renovación para tramitar alta en SS.`);
                }
                if (candidate.rgpdStatus === 'Caducado' || candidate.rgpdStatus === 'Sin consentimiento') {
                    blockers.push(`Consentimiento RGPD no vigente (${candidate.rgpdStatus}). Se requiere firma previa a la cesión a cliente.`);
                }
                if (candidate.status === 'Asignado/En misión') {
                    warnings.push(`El candidato ya tiene una misión activa asignada (${candidate.assignedMission?.petitionId || 'PET'}).`);
                }
                if (pos?.mandatoryRequirements?.includes('Carnet de carretillero en vigor (UNE 58451)') && !candidate.drivingLicenses.some(l => l.includes('Carretillero'))) {
                    blockers.push('No dispone de Carnet de Carretillero UNE 58451 requerido por esta posición.');
                }

                setWizardState({
                    isOpen: true,
                    candidate: candidate,
                    candidatesBatch: [candidate],
                    step: 1,
                    selectedPetitionId: 'PET-2026-0048',
                    selectedPositionId: 'POS-01',
                    selectedPlazaNum: 2, // Default to first vacant
                    assignmentMode: 'plaza',
                    blockersFound: blockers,
                    warningsFound: warnings,
                    overrideReason: ''
                });
            };

            // Recalculate wizard compatibility whenever step or position changes
            const runWizardCompatibilityCheck = (petId, posId, candidate) => {
                if (!candidate) return { blockers: [], warnings: [] };
                const pet = petitions.find(p => p.id === petId);
                const pos = pet?.positions.find(p => p.id === posId);
                const blockers = [];
                const warnings = [];

                if (candidate.dniStatus === 'Caducado') {
                    blockers.push(`Documento de identidad CADUCADO (${candidate.dni}). Impide tramitar alta en Seguridad Social.`);
                }
                if (candidate.dniStatus === 'Falta') {
                    blockers.push('Falta aportar documento de identidad oficial.');
                }
                if (candidate.rgpdStatus === 'Caducado' || candidate.rgpdStatus === 'Sin consentimiento') {
                    blockers.push(`Consentimiento RGPD ${candidate.rgpdStatus.toUpperCase()}. Requiere firma antes de presentar al cliente.`);
                }
                if (candidate.rgpdStatus === 'Próximo a caducar') {
                    warnings.push('El consentimiento RGPD caduca en los próximos 30 días. Se recomienda solicitar refirma.');
                }
                if (candidate.nssStatus === 'Falta') {
                    warnings.push('Número de la Seguridad Social no registrado aún. Deberá aportarse antes del inicio de contrato.');
                }
                if (candidate.status === 'Asignado/En misión') {
                    warnings.push(`Candidato con misión activa (${candidate.assignedMission?.petitionId || 'Actual'}). Verificar compatibilidad de fechas.`);
                }
                
                // Specific position requirements check
                if (pos) {
                    if (pos.mandatoryRequirements?.some(r => r.includes('Carretillero')) && !candidate.drivingLicenses.some(l => l.toLowerCase().includes('carretillero'))) {
                        blockers.push('Requisito excluyente no cumplido: Requiere Carnet de Carretillero UNE 58451.');
                    }
                    if (pos.mandatoryRequirements?.some(r => r.includes('conducir B')) && !candidate.drivingLicenses.includes('B')) {
                        blockers.push('Requisito excluyente no cumplido: Requiere Carnet de conducir B.');
                    }
                    if (pos.turn?.toLowerCase().includes('noche') && candidate.preferredShift?.toLowerCase().includes('mañana') && !candidate.preferredShift.toLowerCase().includes('indiferente')) {
                        warnings.push(`Preferencia horaria: El candidato indicó preferencia por "${candidate.preferredShift}", y la vacante es "${pos.turn}".`);
                    }
                }

                return { blockers, warnings };
            };

            // Apply assignment in Wizard
            const confirmAssignmentWizard = () => {
                const { candidate, selectedPetitionId, selectedPositionId, selectedPlazaNum, assignmentMode } = wizardState;
                if (!candidate) return;

                const pet = petitions.find(p => p.id === selectedPetitionId);
                const pos = pet?.positions.find(p => p.id === selectedPositionId);

                // Update petition plaza
                const updatedPetitions = petitions.map(p => {
                    if (p.id !== selectedPetitionId) return p;
                    return {
                        ...p,
                        positions: p.positions.map(position => {
                            if (position.id !== selectedPositionId) return position;
                            return {
                                ...position,
                                plazas: position.plazas.map(plz => {

                                            ...plz,
                                            status: assignmentMode === 'plaza' ? 'Cubierta' : 'En selección',
                                            candidateName: `${candidate.name} ${candidate.lastName}`,
                                            candidateId: candidate.id,
                                            assignedDate: new Date().toISOString().split('T')[0]

                setPetitions(updatedPetitions);

                // Update Candidate
                const updatedCandidates = candidates.map(c => {
                    if (c.id !== candidate.id) return c;
                    
                    const newStatus = assignmentMode === 'plaza' ? 'Asignado/En misión' : 'En entrevista';
                    const newCandidatureStr = `${selectedPetitionId} (${pos?.title || 'Posición'} · Plaza ${selectedPlazaNum})`;

                                <FileText className="w-4 h-4 text-slate-400" />
                                <span>Presupuestos</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <Building className="w-4 h-4 text-slate-400" />
                                <span>Empresas y clientes</span>
                            </a>

                            {/* ACTIVE ITEM: CANDIDATOS */}
                            <a href="#" className="flex items-center justify-between px-3 py-2 rounded-lg bg-blue-600 text-white font-semibold shadow-md shadow-blue-600/30 transition">
                                <div className="flex items-center gap-3">
                                    <Users className="w-4 h-4 text-white" />
                                    <span>Candidatos</span>
                                </div>
                                <span className="bg-blue-700 text-blue-100 text-[10px] font-bold px-2 py-0.5 rounded-full">{candidates.length}</span>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <CheckSquare className="w-4 h-4 text-slate-400" />
                                <span>Selección & Ternas</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <UserPlus className="w-4 h-4 text-slate-400" />
                                <span>Incorporaciones</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <UserCheck className="w-4 h-4 text-slate-400" />
                                <span>Personal en misión</span>
                            </a>

                            <div className="pt-3 px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400">Control & Facturación</div>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <Clock className="w-4 h-4 text-slate-400" />
                                <span>Horas e incidencias</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <FileCheck2 className="w-4 h-4 text-slate-400" />
                                <span>Facturación & Nóminas</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <FileBadge className="w-4 h-4 text-slate-400" />
                                <span>Documentos & Contratos</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <Award className="w-4 h-4 text-slate-400" />
                                <span>Informes & KPI</span>
                            </a>

                            <div className="pt-3 px-3 py-1.5 text-[10px] font-bold uppercase tracking-wider text-slate-400">Configuración & ETT</div>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <SlidersHorizontal className="w-4 h-4 text-slate-400" />
                                <span>Mi ETT & Parámetros</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <Shield className="w-4 h-4 text-slate-400" />
                                <span>Usuarios y permisos</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <Share2 className="w-4 h-4 text-slate-400" />
                                <span>Integraciones & Portales</span>
                            </a>

                            <a href="#" className="flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                                <Layers className="w-4 h-4 text-slate-400" />
                                <span>Catálogos & Tarifas</span>
                            </a>
                        </nav>

                        {/* User Profile Footer */}
                        <div className="p-3 border-t border-slate-800 bg-slate-950/60 flex items-center justify-between">
                            <div className="flex items-center gap-2.5 min-w-0">
                                <div className="w-8 h-8 rounded-full bg-blue-600/30 text-blue-400 border border-blue-500/40 flex items-center justify-center font-bold text-xs flex-shrink-0">
                                    AG
                                </div>
                                <div className="min-w-0">
                                    <p className="text-xs font-semibold text-slate-200 truncate">Ana Gómez</p>
                                    <p className="text-[10px] text-slate-400 truncate">Consultora Senior ETT</p>
                                </div>
                            </div>
                            <button className="text-slate-400 hover:text-slate-200 p-1 rounded hover:bg-slate-800" title="Cerrar sesión">
                                <ExternalLink className="w-4 h-4" />
                            </button>
                        </div>
                    </aside>

                    {/* ==================================================== */}
                    {/* 2. MAIN CONTENT AREA & HEADER                        */}
                    {/* ==================================================== */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden bg-slate-50">
                        {/* Top Global Header Bar */}
                        <header className="h-14 bg-white border-b border-slate-200 flex items-center justify-between px-6 z-10 flex-shrink-0 shadow-xs">
                            {/* Breadcrumbs */}
                            <div className="flex items-center gap-2 text-xs text-slate-500">
                                <span className="hover:text-slate-800 cursor-pointer">Talentia Express ETT</span>
                                <ChevronRight className="w-3.5 h-3.5 text-slate-400" />
                                <span className="hover:text-slate-800 cursor-pointer">Gestión de Talento</span>
                                <ChevronRight className="w-3.5 h-3.5 text-slate-400" />
                                <span className="font-semibold text-slate-800 bg-slate-100 px-2 py-0.5 rounded text-xs">Candidatos</span>
                            </div>

                            {/* Header Actions & Context Info */}
                            <div className="flex items-center gap-3">
                                <div className="hidden md:flex items-center gap-2 text-xs bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1 rounded-full">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                                    <span>Conexión Portales: <strong>InfoJobs & LinkedIn Activos</strong></span>
                                </div>

                                <div className="h-4 w-[1px] bg-slate-200"></div>

                                <button 
                                    onClick={() => setIsImportPortalOpen(true)}
                                    className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-white border border-slate-300 hover:bg-slate-50 rounded-lg shadow-xs transition"
                                >
                                    <UploadCloud className="w-3.5 h-3.5 text-blue-600" />
                                    <span>Importar desde Portal</span>
                                </button>

                                <div className="relative inline-block text-left">
                                    <button 
                                        onClick={() => setIsQuickCreateOpen(true)}
                                        className="inline-flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm shadow-blue-500/20 transition"
                                    >
                                        <Plus className="w-4 h-4" />
                                        <span>+ Nuevo Candidato</span>
                                    </button>
                                </div>
                            </div>
                        </header>

                        {/* Page Header / Summary Banner */}
                        <div className="px-6 py-4 bg-white border-b border-slate-200 flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <div className="flex items-center gap-3">
                                    <h1 className="text-xl font-black text-slate-900 tracking-tight flex items-center gap-2.5">
                                        <Users className="w-6 h-6 text-blue-600" />
                                        Bandeja de Candidatos
                                    </h1>
                                    <span className="bg-slate-100 text-slate-700 border border-slate-200 font-bold px-2.5 py-0.5 rounded-full text-xs">
                                        {candidates.length} registrados
                                    </span>
                                </div>
                                <p className="text-xs text-slate-500 mt-0.5">
                                    Base de datos de talento ETT, estados de disponibilidad, verificación de identidad, RGPD y asignación a peticiones.
                                </p>
                            </div>

                            {/* KPI Mini-Cards */}
                            <div className="flex items-center gap-2 flex-wrap">
                                <div className="bg-emerald-50 border border-emerald-200/80 rounded-lg px-3 py-1.5 text-left">
                                    <p className="text-[10px] text-emerald-700 font-bold uppercase tracking-wider">Disponibles Inmediatos</p>
                                    <p className="text-base font-black text-emerald-900">
                                        {candidates.filter(c => c.status === 'Disponible').length}
                                    </p>
                                </div>

                                <div className="bg-blue-50 border border-blue-200/80 rounded-lg px-3 py-1.5 text-left">
                                    <p className="text-[10px] text-blue-700 font-bold uppercase tracking-wider">En Misión Activa</p>
                                    <p className="text-base font-black text-blue-900">
                                        {candidates.filter(c => c.status === 'Asignado/En misión').length}
                                    </p>
                                </div>

                                <div className="bg-amber-50 border border-amber-200/80 rounded-lg px-3 py-1.5 text-left">
                                    <p className="text-[10px] text-amber-700 font-bold uppercase tracking-wider">Alertas Documentales</p>
                                    <p className="text-base font-black text-amber-900">
                                        {candidates.filter(c => c.dniStatus !== 'OK' || c.rgpdStatus !== 'Vigente').length}
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Search, Filter Bar and Quick Saved Views */}
                        <div className="px-6 py-3 bg-slate-50 border-b border-slate-200 flex flex-col gap-2.5">
                            {/* Saved views tabs */}
                            <div className="flex items-center justify-between flex-wrap gap-2">
                                <div className="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs">
                                    <span className="text-slate-400 font-semibold mr-1 flex items-center gap-1">
                                        <BookmarkCheck className="w-3.5 h-3.5 text-slate-400" /> Vistas rápidas:
                                    </span>
                                    
                                    <button 
                                        onClick={() => { setSavedPreset('ALL'); setStatusFilter('ALL'); setDocFilter('ALL'); }}
                                        className={`px-3 py-1 rounded-full font-medium transition ${savedPreset === 'ALL' ? 'bg-slate-900 text-white font-bold' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'}`}
                                    >
                                        Todos ({candidates.length})
                                    </button>

                                    <button 
                                        onClick={() => { setSavedPreset('AVAILABLE_NOW'); setStatusFilter('Disponible'); setDocFilter('ALL'); }}
                                        className={`px-3 py-1 rounded-full font-medium transition ${savedPreset === 'AVAILABLE_NOW' ? 'bg-emerald-600 text-white font-bold' : 'bg-white text-emerald-700 border border-emerald-200 hover:bg-emerald-50'}`}
                                    >
                                        Disponibles Ya ({candidates.filter(c => c.status === 'Disponible').length})
                                    </button>

                                    <button 
                                        onClick={() => { setSavedPreset('DOC_PENDING'); setDocFilter('DOC_ALERT'); setStatusFilter('ALL'); }}
                                        className={`px-3 py-1 rounded-full font-medium transition ${savedPreset === 'DOC_PENDING' ? 'bg-amber-600 text-white font-bold' : 'bg-white text-amber-700 border border-amber-200 hover:bg-amber-50'}`}
                                    >
                                        Doc o RGPD Pendiente ({candidates.filter(c => c.dniStatus !== 'OK' || c.rgpdStatus !== 'Vigente').length})
                                    </button>

                                    <button 
                                        onClick={() => { setSavedPreset('ASSIGNED'); setStatusFilter('Asignado/En misión'); }}
                                        className={`px-3 py-1 rounded-full font-medium transition ${savedPreset === 'ASSIGNED' ? 'bg-blue-600 text-white font-bold' : 'bg-white text-blue-700 border border-blue-200 hover:bg-blue-50'}`}
                                    >
                                        En Misión ({candidates.filter(c => c.status === 'Asignado/En misión').length})
                                    </button>
                                </div>

                                {/* View Switcher: Table vs Cards */}
                                <div className="flex items-center gap-1 bg-white border border-slate-200 rounded-lg p-0.5">
                                    <button 
                                        onClick={() => setViewMode('table')}
                                        className={`p-1.5 rounded ${viewMode === 'table' ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-500 hover:text-slate-800'}`}
                                        title="Vista de Tabla detallada"
                                    >
                                        <List className="w-4 h-4" />
                                    </button>
                                    <button 
                                        onClick={() => setViewMode('cards')}
                                        className={`p-1.5 rounded ${viewMode === 'cards' ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-500 hover:text-slate-800'}`}
                                        title="Vista de Tarjetas"
                                    >
                                        <Grid className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>

                            {/* Search and Dropdown Filter Row */}
                            <div className="flex items-center gap-3 flex-wrap">
                                {/* Search input */}
                                <div className="relative flex-1 min-w-[240px]">
                                    <Search className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" />
                                    <input 
                                        type="text" 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Buscar por nombre, DNI, teléfono, email, población, categoría o carnet..." 
                                        className="w-full pl-9 pr-8 py-1.5 bg-white border border-slate-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none shadow-xs"
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600">
                                            <X className="w-3.5 h-3.5" />
                                        </button>
                                    )}
                                </div>

                                {/* Filter: Estado */}
                                <div className="flex items-center gap-1 text-xs">
                                    <span className="text-slate-500 font-medium">Estado:</span>
                                    <select 
                                        value={statusFilter}
                                        onChange={(e) => setStatusFilter(e.target.value)}
                                        className="bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 focus:ring-1 focus:ring-blue-500 outline-none"
                                    >
                                        <option value="ALL">Todos los estados</option>
                                        <option value="Disponible">Disponible</option>
                                        <option value="Asignado/En misión">Asignado/En misión</option>
                                        <option value="En entrevista">En entrevista / Selección</option>
                                        <option value="Nuevo">Nuevo</option>
                                        <option value="Pendiente de contactar">Pendiente contactar</option>
                                        <option value="Contactado">Contactado</option>
                                        <option value="No disponible">No disponible</option>
                                    </select>
                                </div>

                                {/* Filter: Documentación & RGPD */}
                                <div className="flex items-center gap-1 text-xs">
                                    <span className="text-slate-500 font-medium">Doc/RGPD:</span>
                                    <select 
                                        value={docFilter}
                                        onChange={(e) => setDocFilter(e.target.value)}
                                        className="bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 focus:ring-1 focus:ring-blue-500 outline-none"
                                    >
                                        <option value="ALL">Cualquier estado doc</option>
                                        <option value="DOC_OK">Documentación y RGPD OK</option>
                                        <option value="DOC_ALERT">DNI o NSS pendiente/caducado</option>
                                        <option value="RGPD_ALERT">RGPD caducado o pendiente</option>
                                    </select>
                                </div>

                                {/* Filter: Origen */}
                                <div className="flex items-center gap-1 text-xs">
                                    <span className="text-slate-500 font-medium">Origen:</span>
                                    <select 
                                        value={sourceFilter}
                                        onChange={(e) => setSourceFilter(e.target.value)}
                                        className="bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium text-slate-700 focus:ring-1 focus:ring-blue-500 outline-none"
                                    >
                                        <option value="ALL">Todos los orígenes</option>
                                        <option value="InfoJobs">InfoJobs</option>
                                        <option value="LinkedIn">LinkedIn</option>
                                        <option value="Monster">Monster</option>
                                        <option value="Portal Web ETT">Portal Web ETT</option>
                                        <option value="Alta Manual">Alta Manual</option>
                                    </select>
                                </div>

                                {/* Clear Filters button */}
                                {(searchQuery || statusFilter !== 'ALL' || docFilter !== 'ALL' || sourceFilter !== 'ALL' || savedPreset !== 'ALL') && (
                                    <button 
                                        onClick={() => {
                                            setSearchQuery('');
                                            setStatusFilter('ALL');
                                            setDocFilter('ALL');
                                            setSourceFilter('ALL');
                                            setSavedPreset('ALL');
                                        }}
                                        className="text-xs text-rose-600 hover:text-rose-800 font-medium flex items-center gap-1 px-2 py-1 rounded hover:bg-rose-50 transition"
                                    >
                                        <X className="w-3.5 h-3.5" /> Limpiar filtros
                                    </button>
                                )}
                            </div>

                            {/* Bulk Actions Floating Bar when selected */}
                            {selectedIds.length > 0 && (
                                <div className="bg-slate-900 text-white px-4 py-2 rounded-lg flex items-center justify-between text-xs animate-in fade-in slide-in-from-top-1 shadow-lg">
                                    <div className="flex items-center gap-2">
                                        <span className="bg-blue-600 text-white font-bold px-2 py-0.5 rounded text-[11px]">
                                            {selectedIds.length} seleccionados
                                        </span>
                                        <span className="text-slate-300">Acciones masivas disponibles para los candidatos marcados:</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => {
                                                const firstCandidate = candidates.find(c => c.id === selectedIds[0]);
                                                startAssignWizard(firstCandidate);
                                            }}
                                            className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1 rounded flex items-center gap-1.5 transition"
                                        >
                                            <Briefcase className="w-3.5 h-3.5" /> Asignar a Petición
                                        </button>

                                        <button 
                                            onClick={() => {
                                                setBulkActionType('contact');
                                                setIsBulkActionModalOpen(true);
                                            }}
                                            className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1 rounded border border-slate-700 flex items-center gap-1.5 transition"
                                        >
                                            <MessageSquare className="w-3.5 h-3.5" /> Contactar en bloque
                                        </button>

                                        <button 
                                            onClick={() => {
                                                setBulkActionType('docRequest');
                                                setIsBulkActionModalOpen(true);
                                            }}
                                            className="bg-slate-800 hover:bg-slate-700 text-amber-300 px-3 py-1 rounded border border-slate-700 flex items-center gap-1.5 transition"
                                        >
                                            <FileText className="w-3.5 h-3.5" /> Solicitar Documentación
                                        </button>

                                        <button 
                                            onClick={() => setSelectedIds([])}
                                            className="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800"
                                            title="Deseleccionar todos"
                                        >
                                            <X className="w-4 h-4" />
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* ==================================================== */}
                        {/* 3. CANDIDATES DATA DISPLAY (TABLE / CARDS)           */}
                        {/* ==================================================== */}
                        <div className="flex-1 overflow-auto p-6">
                            {filteredCandidates.length === 0 ? (
                                <div className="bg-white rounded-xl border border-slate-200 p-12 text-center max-w-md mx-auto my-8">
                                    <div className="w-12 h-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3">
                                        <Users className="w-6 h-6" />
                                    </div>
                                    <h3 className="text-base font-bold text-slate-800">No se encontraron candidatos</h3>
                                    <p className="text-xs text-slate-500 mt-1 mb-4">
                                        No hay candidatos que coincidan con los filtros aplicados. Prueba a limpiar los criterios de búsqueda.
                                    </p>
                                    <button 
                                        onClick={() => {
                                            setSearchQuery('');
                                            setStatusFilter('ALL');
                                            setDocFilter('ALL');
                                            setSourceFilter('ALL');
                                            setSavedPreset('ALL');
                                        }}
                                        className="bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-lg hover:bg-blue-700 transition"
                                    >
                                        Restablecer todos los filtros
                                    </button>
                                </div>
                            ) : viewMode === 'table' ? (
                                /* Table View */
                                <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse text-xs">
                                            <thead>
                                                <tr className="bg-slate-50/80 border-b border-slate-200 text-slate-500 uppercase tracking-wider text-[11px] font-bold">
                                                    <th className="py-3 px-3 w-8 text-center">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={selectedIds.length === filteredCandidates.length && filteredCandidates.length > 0}
                                                            onChange={handleSelectAll}
                                                            className="rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                                                        />
                                                    </th>
                                                    <th className="py-3 px-4 font-bold text-slate-700">Candidato / Perfil</th>
                                                    <th className="py-3 px-3 font-semibold">Contacto</th>
                                                    <th className="py-3 px-3 font-semibold">Ubicación</th>
                                                    <th className="py-3 px-3 font-semibold">Doc. Identidad</th>
                                                    <th className="py-3 px-3 font-semibold">Nº Seg. Social</th>
                                                    <th className="py-3 px-3 font-semibold">RGPD</th>
                                                    <th className="py-3 px-3 font-semibold">Origen</th>
                                                    <th className="py-3 px-3 font-semibold">Estado</th>
                                                    <th className="py-3 px-3 font-semibold">Candidaturas / Misión</th>
                                                    <th className="py-3 px-4 text-right font-bold text-slate-700">Acciones</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {filteredCandidates.map((c) => {
                                                    const isSelected = selectedIds.includes(c.id);
                                                    return (
                                                        <tr 
                                                            key={c.id} 
                                                            className={`hover:bg-blue-50/40 transition group ${isSelected ? 'bg-blue-50/60' : ''}`}
                                                        >
                                                            {/* Checkbox */}
                                                            <td className="py-3.5 px-3 text-center">
                                                                <input 
                                                                    type="checkbox" 
                                                                    checked={isSelected}
                                                                    onChange={() => handleToggleSelect(c.id)}
                                                                    className="rounded border-slate-300 text-blue-600 focus:ring-blue-500 cursor-pointer"
                                                                />
                                                            </td>

                                                            {/* Candidato / Perfil */}
                                                            <td className="py-3.5 px-4">
                                                                <div className="flex items-start gap-3">
                                                                    <div className="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white font-bold flex items-center justify-center text-xs flex-shrink-0 shadow-xs">
                                                                        {c.name[0]}{c.lastName[0]}
                                                                    </div>
                                                                    <div>
                                                                        <button 
                                                                            onClick={() => setSelectedCandidateForDetail(c)}
                                                                            className="font-bold text-slate-900 hover:text-blue-600 transition text-left flex items-center gap-1.5 group-hover:underline"
                                                                        >
                                                                            <span>{c.name} {c.lastName}</span>
                                                                            <span className="text-[10px] font-mono text-slate-400 font-normal">({c.id})</span>
                                                                        </button>
                                                                        <p className="text-[11px] text-slate-600 font-medium">{c.category}</p>
                                                                        <div className="flex items-center gap-1 mt-0.5">
                                                                            {c.drivingLicenses.includes('Carnet Carretillero UNE 58451') && (
                                                                                <span className="inline-flex items-center gap-0.5 text-[10px] bg-amber-50 text-amber-800 border border-amber-200 px-1.5 py-0.2 rounded font-medium">
                                                                                    <Award className="w-2.5 h-2.5 text-amber-600" /> Carretillero UNE
                                                                                </span>
                                                                            )}
                                                                            <span className="text-[10px] text-slate-400">· {c.experienceYears} años exp.</span>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </td>

                                                            {/* Contacto */}
                                                            <td className="py-3.5 px-3">
                                                                <div className="space-y-0.5 text-xs">
                                                                    <div className="flex items-center gap-1.5 text-slate-700 font-medium">
                                                                        <Phone className="w-3 h-3 text-slate-400" />
                                                                        <span>{c.phone}</span>
                                                                    </div>
                                                                    <div className="flex items-center gap-1.5 text-slate-500 text-[11px] truncate max-w-[150px]" title={c.email}>
                                                                        <Mail className="w-3 h-3 text-slate-400" />
                                                                        <span className="truncate">{c.email}</span>
                                                                    </div>
                                                                </div>
                                                            </td>

                                                            {/* Ubicación */}
                                                            <td className="py-3.5 px-3">
                                                                <div className="text-xs">
                                                                    <p className="font-semibold text-slate-800">{c.city}</p>
                                                                    <p className="text-[11px] text-slate-500 flex items-center gap-1">
                                                                        <MapPin className="w-2.5 h-2.5 text-slate-400" /> {c.distance}
                                                                    </p>
                                                                </div>
                                                            </td>

                                                            {/* Documento de Identidad (DNI/NIE) */}
                                                            <td className="py-3.5 px-3">
                                                                {renderDniBadge(c.dniStatus, c.dniExpiry, c.dni)}
                                                            </td>

                                                            {/* Número Seguridad Social */}
                                                            <td className="py-3.5 px-3">
                                                                {renderNssBadge(c.nssStatus, c.nss)}
                                                            </td>

                                                            {/* RGPD */}
                                                            <td className="py-3.5 px-3">
                                                                {renderRgpdBadge(c.rgpdStatus)}
                                                            </td>

                                                            {/* Origen */}
                                                            <td className="py-3.5 px-3">
                                                                <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 text-slate-700 border border-slate-200">
                                                                    {c.source === 'LinkedIn' && <span className="font-bold text-blue-700">in</span>}
                                                                    {c.source === 'InfoJobs' && <span className="font-bold text-orange-600">IJ</span>}
                                                                    {c.source}
                                                                </span>
                                                            </td>

                                                            {/* Estado */}
                                                            <td className="py-3.5 px-3">
                                                                {renderStatusBadge(c.status)}
                                                            </td>

                                                            {/* Candidaturas / Misión Activa */}
                                                            <td className="py-3.5 px-3">
                                                                {c.assignedMission ? (
                                                                    <div className="bg-blue-50/80 border border-blue-200 rounded p-1.5 max-w-[170px]">
                                                                        <p className="text-[10px] font-bold text-blue-900 truncate">
                                                                            {c.assignedMission.petitionId}
                                                                        </p>
                                                                        <p className="text-[10px] text-blue-700 truncate">
                                                                            Plaza {c.assignedMission.plazaNum} · {c.assignedMission.positionTitle}
                                                                        </p>
                                                                    </div>
                                                                ) : c.activeCandidatures.length > 0 ? (
                                                                    <span className="text-xs text-purple-700 font-medium bg-purple-50 px-2 py-0.5 rounded border border-purple-200">
                                                                        {c.activeCandidatures[0]}
                                                                    </span>
                                                                ) : (
                                                                    <span className="text-xs text-slate-400 italic">Sin asignar</span>
                                                                )}
                                                            </td>

                                                            {/* Acciones Rápidas */}
                                                            <td className="py-3.5 px-4 text-right">
                                                                <div className="flex items-center justify-end gap-1.5">
                                                                    <button 
                                                                        onClick={() => startAssignWizard(c)}
                                                                        className="bg-blue-50 hover:bg-blue-600 text-blue-700 hover:text-white font-semibold px-2.5 py-1 rounded text-xs border border-blue-200 transition flex items-center gap-1 shadow-2xs"
                                                                        title="Asistente de asignación a petición / plaza"
                                                                    >
                                                                        <Briefcase className="w-3.5 h-3.5" />
                                                                        <span>Asignar</span>
                                                                    </button>

                                                                    <button 
                                                                        onClick={() => openContactModal(c)}
                                                                        className="p-1 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded transition"
                                                                        title="Contactar (Llamada, WhatsApp, Email, SMS)"
                                                                    >
                                                                        <PhoneCall className="w-3.5 h-3.5" />
                                                                    </button>

                                                                    <button 
                                                                        onClick={() => setSelectedCandidateForDetail(c)}
                                                                        className="p-1 text-slate-500 hover:text-slate-900 hover:bg-slate-100 rounded transition"
                                                                        title="Ver Ficha Completa del Candidato"
                                                                    >
                                                                        <Eye className="w-3.5 h-3.5" />
                                                                    </button>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ) : (
                                /* Cards Grid View */
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {filteredCandidates.map((c) => (
                                        <div 
                                            key={c.id} 
                                            className="bg-white rounded-xl border border-slate-200 p-4 shadow-xs hover:shadow-md transition flex flex-col justify-between"
                                        >
                                            <div>
                                                <div className="flex items-start justify-between gap-2 mb-3">
                                                    <div className="flex items-center gap-3">
                                                        <div className="w-10 h-10 rounded-full bg-gradient-to-br from-blue-600 to-indigo-600 text-white font-bold flex items-center justify-center text-sm shadow-xs">
                                                            {c.name[0]}{c.lastName[0]}
                                                        </div>
                                                        <div>
                                                            <h3 
                                                                onClick={() => setSelectedCandidateForDetail(c)}
                                                                className="font-bold text-slate-900 hover:text-blue-600 cursor-pointer text-sm"
                                                            >
                                                                {c.name} {c.lastName}
                                                            </h3>
                                                            <p className="text-xs text-slate-500">{c.category}</p>
                                                        </div>
                                                    </div>
                                                    <div>{renderStatusBadge(c.status)}</div>
                                                </div>

                                                <div className="space-y-1.5 text-xs text-slate-600 border-t border-b border-slate-100 py-2.5 my-2">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-slate-400">DNI:</span>
                                                        <span>{renderDniBadge(c.dniStatus, c.dniExpiry, c.dni)}</span>
                                                    </div>
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-slate-400">Teléfono:</span>
                                                        <span className="font-medium text-slate-800">{c.phone}</span>
                                                    </div>
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-slate-400">Ubicación:</span>
                                                        <span className="font-medium text-slate-800">{c.city} ({c.distance})</span>
                                                    </div>
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-slate-400">RGPD:</span>
                                                        <span>{renderRgpdBadge(c.rgpdStatus)}</span>
                                                    </div>
                                                </div>

                                                {/* Assigned Mission or Tags */}
                                                {c.assignedMission ? (
                                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-2 text-xs mb-3">
                                                        <p className="font-bold text-blue-900 flex items-center gap-1">
                                                            <Briefcase className="w-3.5 h-3.5 text-blue-600" />
                                                            {c.assignedMission.petitionId}
                                                        </p>
                                                        <p className="text-blue-700 text-[11px] truncate mt-0.5">
                                                            {c.assignedMission.client} · Plaza {c.assignedMission.plazaNum}
                                                        </p>
                                                    </div>
                                                ) : (
                                                    <div className="flex flex-wrap gap-1 mb-3">
                                                        {c.skills.slice(0, 3).map((sk, idx) => (
                                                            <span key={idx} className="bg-slate-100 text-slate-700 text-[10px] px-2 py-0.5 rounded">
                                                                {sk}
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* Card Footer Actions */}
                                            <div className="flex items-center justify-between pt-2 border-t border-slate-100 gap-2">
                                                <button 
                                                    onClick={() => openContactModal(c)}
                                                    className="flex-1 py-1.5 px-2 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 rounded-lg text-xs font-semibold flex items-center justify-center gap-1 transition"
                                                >
                                                    <Phone className="w-3.5 h-3.5" /> Contactar
                                                </button>
                                                <button 
                                                    onClick={() => startAssignWizard(c)}
                                                    className="flex-1 py-1.5 px-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-1 shadow-xs transition"
                                                >
                                                    <Briefcase className="w-3.5 h-3.5" /> Asignar
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* ==================================================== */}
                    {/* 4. MODAL / DRAWER: FICHA COMPLETA DEL CANDIDATO      */}
                    {/* ==================================================== */}
                    {selectedCandidateForDetail && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex justify-end animate-in fade-in duration-200">
                            <div className="w-full max-w-3xl bg-white h-full shadow-2xl flex flex-col overflow-hidden animate-in slide-in-from-right duration-300">
                                {/* Header Ficha */}
                                <div className="p-6 bg-slate-900 text-white flex items-start justify-between flex-shrink-0">
                                    <div className="flex items-start gap-4">
                                        <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white font-black text-xl flex items-center justify-center shadow-lg shadow-blue-500/30">
                                            {selectedCandidateForDetail.name[0]}{selectedCandidateForDetail.lastName[0]}
                                        </div>
                                        <div>
                                            <div className="flex items-center gap-2 flex-wrap">
                                                <h2 className="text-xl font-bold tracking-tight">
                                                    {selectedCandidateForDetail.name} {selectedCandidateForDetail.lastName}
                                                </h2>
                                                {renderStatusBadge(selectedCandidateForDetail.status)}
                                            </div>
                                            <p className="text-xs text-slate-300 mt-1 flex items-center gap-2">
                                                <span>ID: <strong className="font-mono text-blue-300">{selectedCandidateForDetail.id}</strong></span>
                                                <span>·</span>
                                                <span>{selectedCandidateForDetail.category}</span>
                                                <span>·</span>
                                                <span>Origen: {selectedCandidateForDetail.source}</span>
                                            </p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setSelectedCandidateForDetail(null)}
                                        className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition"
                                    >
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* Quick Action Bar inside Drawer */}
                                <div className="px-6 py-2.5 bg-slate-800 text-slate-200 border-t border-slate-700 flex items-center justify-between text-xs flex-shrink-0">
                                    <div className="flex items-center gap-3">
                                        <div className="flex items-center gap-1">
                                            <Phone className="w-3.5 h-3.5 text-slate-400" />
                                            <span>{selectedCandidateForDetail.phone}</span>
                                        </div>
                                        <div className="flex items-center gap-1">
                                            <Mail className="w-3.5 h-3.5 text-slate-400" />
                                            <span>{selectedCandidateForDetail.email}</span>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => openContactModal(selectedCandidateForDetail)}
                                            className="bg-slate-700 hover:bg-slate-600 text-white px-2.5 py-1 rounded font-semibold flex items-center gap-1 transition"
                                        >
                                            <PhoneCall className="w-3.5 h-3.5 text-blue-400" /> Contactar
                                        </button>
                                        <button 
                                            onClick={() => {
                                                const can = selectedCandidateForDetail;
                                                setSelectedCandidateForDetail(null);
                                                startAssignWizard(can);
                                            }}
                                            className="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded font-bold flex items-center gap-1 transition"
                                        >
                                            <Briefcase className="w-3.5 h-3.5" /> Asignar a Petición
                                        </button>
                                    </div>
                                </div>

                                {/* Tabs navigation */}
                                <div className="px-6 bg-white border-b border-slate-200 flex items-center gap-4 text-xs font-semibold overflow-x-auto flex-shrink-0">
                                    {[
                                        { id: 'resumen', label: 'Resumen & Alertas', icon: Info },
                                        { id: 'personal', label: 'Datos Personales', icon: Users },
                                        { id: 'profesional', label: 'Perfil Profesional & Carnets', icon: Award },
                                        { id: 'disponibilidad', label: 'Disponibilidad & Turnos', icon: Clock },
                                        { id: 'documentos', label: 'Documentos & RGPD', icon: FileBadge },
                                        { id: 'candidaturas', label: 'Candidaturas & Misiones', icon: Briefcase },
                                        { id: 'historial', label: 'Historial de Contacto', icon: MessageSquare }
                                    ].map(tab => {
                                        const Icon = tab.icon;
                                        return (
                                            <button 
                                                key={tab.id}
                                                onClick={() => setDetailTab(tab.id)}
                                                className={`py-3 flex items-center gap-1.5 border-b-2 transition whitespace-nowrap ${detailTab === tab.id ? 'border-blue-600 text-blue-600 font-bold' : 'border-transparent text-slate-500 hover:text-slate-800'}`}
                                            >
                                                <Icon className="w-3.5 h-3.5" />
                                                <span>{tab.label}</span>
                                            </button>
                                        );
                                    })}
                                </div>

                                {/* Tab Content Area */}
                                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                                    {detailTab === 'resumen' && (
                                        <div className="space-y-4">
                                            {/* Document Status Alert Cards */}
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                                                <div className={`p-3.5 rounded-xl border ${selectedCandidateForDetail.dniStatus === 'OK' ? 'bg-emerald-50/60 border-emerald-200' : 'bg-rose-50 border-rose-300'}`}>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="text-xs font-bold text-slate-700">Documento Identidad</span>
                                                        {selectedCandidateForDetail.dniStatus === 'OK' ? (
                                                            <CheckCircle2 className="w-4 h-4 text-emerald-600" />
                                                        ) : (
                                                            <AlertOctagon className="w-4 h-4 text-rose-600" />
                                                        )}
                                                    </div>
                                                    <p className="text-sm font-mono font-bold text-slate-900">{selectedCandidateForDetail.dni}</p>
                                                    <p className="text-[11px] text-slate-500 mt-0.5">
                                                        {selectedCandidateForDetail.dniStatus === 'OK' ? `Válido hasta ${selectedCandidateForDetail.dniExpiry}` : `CADUCADO el ${selectedCandidateForDetail.dniExpiry}`}
                                                    </p>
                                                </div>

                                                <div className={`p-3.5 rounded-xl border ${selectedCandidateForDetail.rgpdStatus === 'Vigente' ? 'bg-emerald-50/60 border-emerald-200' : 'bg-amber-50 border-amber-300'}`}>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="text-xs font-bold text-slate-700">Consentimiento RGPD</span>
                                                        <Shield className={`w-4 h-4 ${selectedCandidateForDetail.rgpdStatus === 'Vigente' ? 'text-emerald-600' : 'text-amber-600'}`} />
                                                    </div>
                                                    <p className="text-sm font-bold text-slate-900">{selectedCandidateForDetail.rgpdStatus}</p>
                                                    <p className="text-[11px] text-slate-500 mt-0.5">
                                                        Firmado el {selectedCandidateForDetail.rgpdSignedDate || 'No firmado'}
                                                    </p>
                                                </div>

                                                <div className={`p-3.5 rounded-xl border ${selectedCandidateForDetail.nssStatus === 'OK' ? 'bg-emerald-50/60 border-emerald-200' : 'bg-amber-50 border-amber-300'}`}>
                                                    <div className="flex items-center justify-between mb-1">
                                                        <span className="text-xs font-bold text-slate-700">Seguridad Social (NSS)</span>
                                                        <Check className={`w-4 h-4 ${selectedCandidateForDetail.nssStatus === 'OK' ? 'text-emerald-600' : 'text-amber-600'}`} />
                                                    </div>
                                                    <p className="text-sm font-mono font-bold text-slate-900">{selectedCandidateForDetail.nss}</p>
                                                    <p className="text-[11px] text-slate-500 mt-0.5">
                                                        {selectedCandidateForDetail.nssStatus === 'OK' ? 'Listo para trámites de afiliación' : 'Pendiente de aportar resguardo'}
                                                    </p>
                                                </div>
                                            </div>

                                            {/* Mission Banner if Assigned */}
                                            {selectedCandidateForDetail.assignedMission && (
                                                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-xl p-4">
                                                    <div className="flex items-center justify-between">
                                                        <div className="flex items-center gap-2">
                                                            <Briefcase className="w-5 h-5 text-blue-600" />
                                                            <h4 className="font-bold text-blue-950 text-sm">Misión Activa Asignada</h4>
                                                        </div>
                                                        <span className="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded">En curso</span>
                                                    </div>
                                                    <div className="grid grid-cols-2 gap-3 mt-3 text-xs">
                                                        <div>
                                                            <span className="text-slate-500">Petición / Cliente:</span>
                                                            <p className="font-bold text-slate-900">{selectedCandidateForDetail.assignedMission.petitionId} · {selectedCandidateForDetail.assignedMission.client}</p>
                                                        </div>
                                                        <div>
                                                            <span className="text-slate-500">Posición & Plaza:</span>
                                                            <p className="font-bold text-slate-900">{selectedCandidateForDetail.assignedMission.positionTitle} (Plaza {selectedCandidateForDetail.assignedMission.plazaNum})</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Key Skills & Competencies */}
                                            <div className="bg-white border border-slate-200 rounded-xl p-4">
                                                <h4 className="font-bold text-slate-800 text-xs uppercase tracking-wider mb-2">Competencias & Certificados</h4>
                                                <div className="flex flex-wrap gap-1.5">
                                                    {selectedCandidateForDetail.drivingLicenses.map((lic, i) => (
                                                        <span key={i} className="bg-amber-100 text-amber-900 font-semibold text-xs px-2.5 py-1 rounded-md border border-amber-300 flex items-center gap-1">
                                                            <Award className="w-3 h-3 text-amber-700" /> {lic}
                                                        </span>
                                                    ))}
                                                    {selectedCandidateForDetail.skills.map((sk, i) => (
                                                        <span key={i} className="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md">
                                                            {sk}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* Latest Communications Log Preview */}
                                            <div className="bg-white border border-slate-200 rounded-xl p-4">
                                                <div className="flex items-center justify-between mb-3">
