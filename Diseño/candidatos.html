                                            Conexiones activas con ATS y portales de empleo de Talentia Express.
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setIsImportPortalOpen(false)}
                                        className="text-slate-400 hover:text-white"
                                    >
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-6 space-y-3.5 text-xs">
                                    <p className="text-slate-600">
                                        Selecciona el conector del portal para sincronizar las últimas candidaturas recibidas e incorporarlas al ERP:
                                    </p>

                                    <div className="space-y-2.5">
                                        <div className="p-3.5 rounded-xl border border-orange-200 bg-orange-50/40 flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <div className="w-9 h-9 rounded-lg bg-orange-500 text-white font-black text-sm flex items-center justify-center shadow-xs">
                                                    IJ
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-slate-900 text-xs">InfoJobs e-Recruitment API</h4>
                                                    <p className="text-[11px] text-slate-500">Conexión en tiempo real · 3 inscripciones pendientes</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleImportFromPortal('InfoJobs')}
                                                className="bg-orange-600 hover:bg-orange-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-2xs transition"
                                            >
                                                Importar
                                            </button>
                                        </div>

                                        <div className="p-3.5 rounded-xl border border-blue-200 bg-blue-50/40 flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <div className="w-9 h-9 rounded-lg bg-blue-700 text-white font-black text-sm flex items-center justify-center shadow-xs">
                                                    in
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-slate-900 text-xs">LinkedIn Recruiter ATS</h4>
                                                    <p className="text-[11px] text-slate-500">Sincronización de perfiles guardados</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleImportFromPortal('LinkedIn')}
                                                className="bg-blue-700 hover:bg-blue-800 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-2xs transition"
                                            >
                                                Importar
                                            </button>
                                        </div>

                                        <div className="p-3.5 rounded-xl border border-purple-200 bg-purple-50/40 flex items-center justify-between">
                                            <div className="flex items-center gap-3">
                                                <div className="w-9 h-9 rounded-lg bg-purple-600 text-white font-black text-sm flex items-center justify-center shadow-xs">
                                                    M
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-slate-900 text-xs">Monster / Indeed XML Feed</h4>
                                                    <p className="text-[11px] text-slate-500">Importación por lote de CVs recibidos</p>
                                                </div>
                                            </div>
                                            <button 
                                                onClick={() => handleImportFromPortal('Monster')}
                                                className="bg-purple-600 hover:bg-purple-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs shadow-2xs transition"
                                            >
                                                Importar
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 bg-slate-50 border-t border-slate-200 text-right">
                                    <button 
                                        onClick={() => setIsImportPortalOpen(false)}
                                        className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 text-xs font-semibold"
                                    >
                                        Cerrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================================================== */}
                    {/* 9. MODAL: ACCIONES MASIVAS                           */}
                    {/* ==================================================== */}
                    {isBulkActionModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-md overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                                    <div>
                                        <h3 className="font-bold text-base">Acción Masiva: {selectedIds.length} Candidatos</h3>
                                        <p className="text-xs text-slate-300 mt-0.5">Ejecutar operación simultánea en el lote seleccionado.</p>
                                    </div>
                                    <button onClick={() => setIsBulkActionModalOpen(false)} className="text-slate-400 hover:text-white">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-6 space-y-4 text-xs">
                                    {bulkActionType === 'contact' && (
                                        <>
                                            <p className="text-slate-700">Se enviará una comunicación por SMS/Email a los {selectedIds.length} candidatos seleccionados:</p>
                                            <textarea 
                                                defaultValue="Hola, desde Talentia Express ETT te informamos de nuevas oportunidades de empleo en el sector logístico de Madrid. Responde a este mensaje para confirmar disponibilidad."
                                                rows={3}
                                                className="w-full p-2.5 border border-slate-300 rounded-lg text-xs"
                                            />
                                        </>
                                    )}

                                    {bulkActionType === 'docRequest' && (
                                        <>
                                            <p className="text-slate-700">Se generará una solicitud formal con enlace seguro para que los candidatos aporten o renueven su documento de identidad y RGPD.</p>
                                            <div className="bg-amber-50 p-3 rounded-lg border border-amber-200 text-amber-800">
                                                Enlace auto-firmable con validez de 7 días.
                                            </div>
                                        </>
                                    )}
                                </div>

                                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs">
                                    <button 
                                        onClick={() => setIsBulkActionModalOpen(false)}
                                        className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={() => {
                                            setIsBulkActionModalOpen(false);
                                            showToast('Acción masiva completada', `Operación procesada con éxito para ${selectedIds.length} candidatos.`, 'success');
                                            setSelectedIds([]);
                                        }}
                                        className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm"
                                    >
                                        Confirmar y Enviar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================================================== */}
                    {/* 10. FLOATING TOAST FEEDBACK NOTIFICATION            */}
                    {/* ==================================================== */}
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 max-w-sm bg-slate-900 text-white p-4 rounded-xl shadow-2xl border border-slate-800 flex items-start gap-3 animate-in slide-in-from-bottom-5 duration-300">
                            {toast.type === 'success' ? (
                                <CheckCircle2 className="w-5 h-5 text-emerald-400 flex-shrink-0 mt-0.5" />
                            ) : toast.type === 'error' ? (
                                <XCircle className="w-5 h-5 text-rose-400 flex-shrink-0 mt-0.5" />
                            ) : (
                                <Info className="w-5 h-5 text-blue-400 flex-shrink-0 mt-0.5" />
                            )}
                            <div className="flex-1">
                                <h4 className="font-bold text-xs text-white">{toast.title}</h4>
                                <p className="text-[11px] text-slate-300 mt-0.5">{toast.message}</p>
                            </div>
                            <button onClick={() => setToast(null)} className="text-slate-400 hover:text-white">
                                <X className="w-4 h-4" />
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // Render application
        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
