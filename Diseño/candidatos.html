                                                    <h4 className="font-bold text-slate-800 text-xs uppercase tracking-wider">Último Contacto Registrado</h4>
                                                    <button onClick={() => setDetailTab('historial')} className="text-blue-600 text-xs hover:underline font-semibold">Ver todo el historial</button>
                                                </div>
                                                {selectedCandidateForDetail.communications.length > 0 ? (
                                                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-3 text-xs">
                                                        <div className="flex items-center justify-between mb-1">
                                                            <span className="font-bold text-slate-900">{selectedCandidateForDetail.communications[0].channel} · {selectedCandidateForDetail.communications[0].result}</span>
                                                            <span className="text-[11px] text-slate-400">{selectedCandidateForDetail.communications[0].date}</span>
                                                        </div>
                                                        <p className="text-slate-600">{selectedCandidateForDetail.communications[0].note}</p>
                                                    </div>
                                                ) : (
                                                    <p className="text-xs text-slate-400 italic">No hay registros de contacto previos.</p>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {detailTab === 'personal' && (
                                        <div className="space-y-4">
                                            <div className="grid grid-cols-2 gap-4 text-xs">
                                                <div>
                                                    <label className="text-slate-500 font-medium">Nombre</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.name} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-500 font-medium">Apellidos</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.lastName} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-500 font-medium">Documento de identidad (DNI/NIE)</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.dni} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-mono font-semibold text-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-500 font-medium">Caducidad Documento</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.dniExpiry} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-500 font-medium">Teléfono móvil</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.phone} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-500 font-medium">Correo Electrónico</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.email} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-500 font-medium">Población / Municipio</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.city} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-800" />
                                                </div>
                                                <div>
                                                    <label className="text-slate-500 font-medium">Provincia</label>
                                                    <input type="text" readOnly value={selectedCandidateForDetail.province} className="w-full mt-1 p-2 bg-slate-50 border border-slate-200 rounded-lg font-semibold text-slate-800" />
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {detailTab === 'profesional' && (
                                        <div className="space-y-4 text-xs">
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                                <h4 className="font-bold text-slate-900 mb-2">Categoría y Experiencia Laboral</h4>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <span className="text-slate-500">Categoría Principal:</span>
                                                        <p className="font-bold text-slate-800">{selectedCandidateForDetail.category}</p>
                                                    </div>
                                                    <div>
                                                        <span className="text-slate-500">Años de experiencia demostrable:</span>
                                                        <p className="font-bold text-slate-800">{selectedCandidateForDetail.experienceYears} años</p>
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                                <h4 className="font-bold text-slate-900 mb-2">Permisos de Conducir & Maquinaria</h4>
                                                <div className="space-y-2">
                                                    {selectedCandidateForDetail.drivingLicenses.map((lic, i) => (
                                                        <div key={i} className="flex items-center gap-2 text-slate-800 font-medium">
                                                            <CheckCircle2 className="w-4 h-4 text-emerald-600" />
                                                            <span>{lic}</span>
                                                        </div>
                                                    ))}
                                                    <div className="flex items-center gap-2 text-slate-700 font-medium pt-1">
                                                        <span className="text-slate-500">Vehículo propio para desplazamientos:</span>
                                                        <span className="font-bold text-slate-900">{selectedCandidateForDetail.hasCar ? 'Sí (Disponible)' : 'No'}</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {detailTab === 'disponibilidad' && (
                                        <div className="space-y-4 text-xs">
                                            <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                                                <h4 className="font-bold text-slate-900 mb-2">Preferencias Horarias & Turnos</h4>
                                                <div className="grid grid-cols-2 gap-3">
                                                    <div>
                                                        <span className="text-slate-500">Preferencia declarada:</span>
                                                        <p className="font-bold text-blue-900">{selectedCandidateForDetail.preferredShift}</p>
                                                    </div>
                                                    <div>
                                                        <span className="text-slate-500">Incorporación:</span>
                                                        <p className="font-bold text-emerald-800">Inmediata (menos de 24h)</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {detailTab === 'documentos' && (
                                        <div className="space-y-4 text-xs">
                                            <div className="flex items-center justify-between">
                                                <h4 className="font-bold text-slate-900">Documentos Custodiados en TramitNow</h4>
                                                <button 
                                                    onClick={() => showToast('Subir documento', 'Simulador de carga de archivo PDF/imagen activado.', 'info')}
                                                    className="bg-blue-600 text-white font-semibold px-3 py-1 rounded-lg hover:bg-blue-700 transition flex items-center gap-1"
                                                >
                                                    <FileUp className="w-3.5 h-3.5" /> + Subir Documento
                                                </button>
                                            </div>

                                            <div className="border border-slate-200 rounded-xl divide-y divide-slate-100 overflow-hidden">
                                                {selectedCandidateForDetail.documents.map((doc, idx) => (
                                                    <div key={idx} className="p-3.5 flex items-center justify-between hover:bg-slate-50">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center font-bold">
                                                                <FileText className="w-4 h-4" />
                                                            </div>
                                                            <div>
                                                                <p className="font-bold text-slate-800">{doc.name}</p>
                                                                <p className="text-[11px] text-slate-400">Tipo: {doc.type} · Subido el {doc.uploadDate}</p>
                                                            </div>
                                                        </div>
                                                        <div className="flex items-center gap-2">
                                                            <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${doc.status === 'Verificado' || doc.status === 'Vigente' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-rose-50 text-rose-700 border border-rose-200'}`}>
                                                                {doc.status}
                                                            </span>
                                                            <button className="text-slate-400 hover:text-slate-700 p-1" title="Descargar">
                                                                <Download className="w-3.5 h-3.5" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {detailTab === 'candidaturas' && (
                                        <div className="space-y-4 text-xs">
                                            <h4 className="font-bold text-slate-900">Histórico de Peticiones y Plazas Asignadas</h4>
                                            {selectedCandidateForDetail.assignedMission ? (
                                                <div className="bg-white border border-blue-200 rounded-xl p-4 shadow-xs">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <span className="font-bold text-blue-900 text-sm">{selectedCandidateForDetail.assignedMission.petitionId}</span>
                                                        <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">Misión Activa</span>
                                                    </div>
                                                    <p className="text-slate-700 font-semibold">{selectedCandidateForDetail.assignedMission.client}</p>
                                                    <p className="text-slate-500 mt-1">Posición: {selectedCandidateForDetail.assignedMission.positionTitle} · Plaza {selectedCandidateForDetail.assignedMission.plazaNum}</p>
                                                    <p className="text-slate-400 text-[11px] mt-1">Inicio previsto: {selectedCandidateForDetail.assignedMission.startDate}</p>
                                                </div>
                                            ) : (
                                                <div className="bg-slate-50 border border-slate-200 rounded-xl p-6 text-center text-slate-400">
                                                    No hay candidaturas activas ni contratos en curso en este momento.
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {detailTab === 'historial' && (
                                        <div className="space-y-4 text-xs">
                                            <div className="flex items-center justify-between">
                                                <h4 className="font-bold text-slate-900">Historial de Comunicaciones & Actividad</h4>
                                                <button 
                                                    onClick={() => openContactModal(selectedCandidateForDetail)}
                                                    className="bg-slate-800 text-white font-semibold px-3 py-1 rounded-lg hover:bg-slate-700 transition flex items-center gap-1"
                                                >
                                                    <Plus className="w-3.5 h-3.5" /> + Registrar Contacto
                                                </button>
                                            </div>

                                            <div className="space-y-3">
                                                {selectedCandidateForDetail.communications.map((comm, idx) => (
                                                    <div key={idx} className="bg-white border border-slate-200 rounded-xl p-3.5 shadow-2xs">
                                                        <div className="flex items-center justify-between mb-1.5">
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-bold text-slate-900">{comm.channel}</span>
                                                                <span className="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.2 rounded font-medium text-[10px]">{comm.result}</span>
                                                            </div>
                                                            <span className="text-[11px] text-slate-400">{comm.date} · {comm.user}</span>
                                                        </div>
                                                        <p className="text-slate-700 text-xs">{comm.note}</p>
                                                        {comm.nextAction && (
                                                            <div className="mt-2 text-[11px] text-blue-600 font-semibold flex items-center gap-1">
                                                                <ArrowRight className="w-3 h-3" /> Próximo paso: {comm.nextAction}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Drawer Footer */}
                                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between flex-shrink-0 text-xs">
                                    <button 
                                        onClick={() => setSelectedCandidateForDetail(null)}
                                        className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold"
                                    >
                                        Cerrar Ficha
                                    </button>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={() => {
                                                const can = selectedCandidateForDetail;
                                                setSelectedCandidateForDetail(null);
                                                startAssignWizard(can);
                                            }}
                                            className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm flex items-center gap-1.5"
                                        >
                                            <Briefcase className="w-4 h-4" /> Asignar a Petición
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================================================== */}
                    {/* 5. GUIDED WIZARD: ASIGNACIÓN A PETICIÓN / PLAZA      */}
                    {/* ==================================================== */}
                    {wizardState.isOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-3xl overflow-hidden flex flex-col max-h-[90vh] animate-in zoom-in-95 duration-200">
                                {/* Wizard Header */}
                                <div className="p-5 bg-gradient-to-r from-blue-700 to-indigo-700 text-white flex items-center justify-between flex-shrink-0">
                                    <div>
                                        <div className="flex items-center gap-2">
                                            <span className="bg-white/20 text-white font-bold text-[10px] px-2 py-0.5 rounded-full uppercase tracking-wider">
                                                Asistente Guiado de Asignación
                                            </span>
                                            <span className="text-blue-200 text-xs">Paso {wizardState.step} de 4</span>
                                        </div>
                                        <h3 className="text-lg font-black tracking-tight mt-1">
                                            Asignar Candidato a Petición y Plaza
                                        </h3>
                                        <p className="text-xs text-blue-100">
                                            Candidato seleccionado: <strong className="text-white underline">{wizardState.candidate?.name} {wizardState.candidate?.lastName}</strong> ({wizardState.candidate?.id})
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setWizardState(prev => ({ ...prev, isOpen: false }))}
                                        className="text-blue-200 hover:text-white p-1 rounded-lg hover:bg-white/10 transition"
                                    >
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* Step Indicator Bar */}
                                <div className="px-6 py-2.5 bg-slate-100 border-b border-slate-200 flex items-center justify-between text-xs font-semibold flex-shrink-0">
                                    <div className={`flex items-center gap-1.5 ${wizardState.step >= 1 ? 'text-blue-600 font-bold' : 'text-slate-400'}`}>
                                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs ${wizardState.step >= 1 ? 'bg-blue-600 text-white' : 'bg-slate-300 text-slate-700'}`}>1</span>
                                        <span>Petición ETT</span>
                                    </div>
                                    <ChevronRight className="w-3.5 h-3.5 text-slate-400" />
                                    <div className={`flex items-center gap-1.5 ${wizardState.step >= 2 ? 'text-blue-600 font-bold' : 'text-slate-400'}`}>
                                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs ${wizardState.step >= 2 ? 'bg-blue-600 text-white' : 'bg-slate-300 text-slate-700'}`}>2</span>
                                        <span>Posición & Turno</span>
                                    </div>
                                    <ChevronRight className="w-3.5 h-3.5 text-slate-400" />
                                    <div className={`flex items-center gap-1.5 ${wizardState.step >= 3 ? 'text-blue-600 font-bold' : 'text-slate-400'}`}>
                                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs ${wizardState.step >= 3 ? 'bg-blue-600 text-white' : 'bg-slate-300 text-slate-700'}`}>3</span>
                                        <span>Selección Plaza</span>
                                    </div>
                                    <ChevronRight className="w-3.5 h-3.5 text-slate-400" />
                                    <div className={`flex items-center gap-1.5 ${wizardState.step >= 4 ? 'text-blue-600 font-bold' : 'text-slate-400'}`}>
                                        <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs ${wizardState.step >= 4 ? 'bg-blue-600 text-white' : 'bg-slate-300 text-slate-700'}`}>4</span>
                                        <span>Validación & Confirmar</span>
                                    </div>
                                </div>

                                {/* Step Content Area */}
                                <div className="p-6 flex-1 overflow-y-auto">
                                    {/* PASO 1: SELECCIONAR PETICIÓN */}
                                    {wizardState.step === 1 && (
                                        <div className="space-y-4">
                                            <div>
                                                <h4 className="text-sm font-bold text-slate-900">Selecciona la petición de cliente de destino</h4>
                                                <p className="text-xs text-slate-500">Muestra las peticiones abiertas en Talentia Express ETT con plazas pendientes de cubrir.</p>
                                            </div>

                                            <div className="space-y-3">
                                                {petitions.map(pet => (
                                                    <div 
                                                        key={pet.id}
                                                        onClick={() => setWizardState(prev => ({ 
                                                            ...prev, 
                                                            selectedPetitionId: pet.id,
                                                            selectedPositionId: pet.positions[0]?.id || ''
                                                        }))}
                                                        className={`p-4 rounded-xl border cursor-pointer transition ${wizardState.selectedPetitionId === pet.id ? 'border-blue-600 bg-blue-50/50 ring-2 ring-blue-500/20' : 'border-slate-200 hover:border-slate-300 bg-white'}`}
                                                    >
                                                        <div className="flex items-start justify-between">
                                                            <div>
                                                                <div className="flex items-center gap-2">
                                                                    <span className="font-mono font-bold text-blue-900 text-sm">{pet.id}</span>
                                                                    <span className="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded">{pet.status}</span>
                                                                </div>
                                                                <h5 className="font-bold text-slate-900 text-sm mt-1">{pet.client}</h5>
                                                                <p className="text-xs text-slate-500 flex items-center gap-1 mt-0.5">
                                                                    <MapPin className="w-3 h-3 text-slate-400" /> {pet.workplace}
                                                                </p>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="text-xs text-slate-500">Inicio:</span>
                                                                <p className="font-bold text-slate-800 text-xs">{pet.startDate}</p>
                                                                <span className="text-[11px] text-blue-600 font-semibold">{pet.positions.length} posiciones</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* PASO 2: SELECCIONAR POSICIÓN */}
                                    {wizardState.step === 2 && (
                                        <div className="space-y-4">
                                            {(() => {
                                                const currentPet = petitions.find(p => p.id === wizardState.selectedPetitionId);
                                                return (
                                                    <>
                                                        <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 flex items-center justify-between text-xs">
                                                            <div>
                                                                <span className="text-slate-400">Petición seleccionada:</span>
                                                                <p className="font-bold text-slate-900">{currentPet?.id} · {currentPet?.client}</p>
                                                            </div>
                                                            <button 
                                                                onClick={() => setWizardState(prev => ({ ...prev, step: 1 }))}
                                                                className="text-blue-600 font-semibold hover:underline"
                                                            >
                                                                Cambiar
                                                            </button>
                                                        </div>

                                                        <div>
                                                            <h4 className="text-sm font-bold text-slate-900">Selecciona la posición de trabajo</h4>
                                                            <p className="text-xs text-slate-500">Cada posición define requisitos obligatorios, salario/hora y turno.</p>
                                                        </div>

                                                        <div className="space-y-3">
                                                            {currentPet?.positions.map(pos => {
                                                                const vacantCount = pos.plazas.filter(p => p.status === 'Vacante').length;
                                                                const isSelected = wizardState.selectedPositionId === pos.id;
                                                                return (
                                                                    <div 
                                                                        key={pos.id}
                                                                        onClick={() => setWizardState(prev => ({ ...prev, selectedPositionId: pos.id }))}
                                                                        className={`p-4 rounded-xl border cursor-pointer transition ${isSelected ? 'border-blue-600 bg-blue-50/50 ring-2 ring-blue-500/20' : 'border-slate-200 hover:border-slate-300 bg-white'}`}
                                                                    >
                                                                        <div className="flex items-start justify-between">
                                                                            <div>
                                                                                <div className="flex items-center gap-2">
                                                                                    <span className="font-mono text-xs font-bold text-blue-700">{pos.id}</span>
                                                                                    <span className="bg-slate-100 text-slate-700 text-[10px] font-semibold px-2 py-0.5 rounded">{pos.category}</span>
                                                                                </div>
                                                                                <h5 className="font-bold text-slate-900 text-sm mt-1">{pos.title}</h5>
                                                                                <p className="text-xs text-slate-600 mt-1 flex items-center gap-1 font-medium">
                                                                                    <Clock className="w-3.5 h-3.5 text-blue-500" /> {pos.turn} · <strong className="text-emerald-700">{pos.rate}</strong>
                                                                                </p>
                                                                                
                                                                                {/* Mandatory requirements chips */}
                                                                                <div className="mt-2 flex flex-wrap gap-1">
                                                                                    {pos.mandatoryRequirements.map((req, idx) => (
                                                                                        <span key={idx} className="bg-amber-50 text-amber-900 border border-amber-200 text-[10px] font-medium px-2 py-0.5 rounded">
                                                                                            * {req}
                                                                                        </span>
                                                                                    ))}
                                                                                </div>
                                                                            </div>

                                                                            <div className="text-right">
                                                                                <span className={`inline-block px-2.5 py-1 rounded-full text-xs font-bold ${vacantCount > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}`}>
                                                                                    {vacantCount} de {pos.plazasTotal} plazas libres
                                                                                </span>
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </>
                                                );
                                            })()}
                                        </div>
                                    )}

                                    {/* PASO 3: SELECCIONAR PLAZA CONCRETA */}
                                    {wizardState.step === 3 && (
                                        <div className="space-y-4">
                                            {(() => {
                                                const currentPet = petitions.find(p => p.id === wizardState.selectedPetitionId);
                                                const currentPos = currentPet?.positions.find(p => p.id === wizardState.selectedPositionId);
                                                
                                                return (
                                                    <>
                                                        <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs flex items-center justify-between">
                                                            <div>
                                                                <span className="text-slate-400">Petición & Posición:</span>
                                                                <p className="font-bold text-slate-900">{currentPet?.id} · {currentPos?.title}</p>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="text-slate-400">Turno:</span>
                                                                <p className="font-semibold text-slate-800">{currentPos?.turn}</p>
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <h4 className="text-sm font-bold text-slate-900">Selecciona la plaza concreta</h4>
                                                            <p className="text-xs text-slate-500">Puedes asignar directamente a una plaza vacante o iniciar candidatura en terna.</p>
                                                        </div>

                                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                            {currentPos?.plazas.map(plz => {
                                                                const isVacant = plz.status === 'Vacante';
                                                                const isSelected = Number(wizardState.selectedPlazaNum) === plz.plazaNum;
                                                                return (
                                                                    <div 
                                                                        key={plz.plazaNum}
                                                                        onClick={() => isVacant && setWizardState(prev => ({ ...prev, selectedPlazaNum: plz.plazaNum }))}
                                                                        className={`p-3.5 rounded-xl border transition ${!isVacant ? 'bg-slate-100 border-slate-200 opacity-80 cursor-not-allowed' : isSelected ? 'bg-blue-50/70 border-blue-600 ring-2 ring-blue-500/20 cursor-pointer' : 'bg-white border-slate-200 hover:border-slate-300 cursor-pointer'}`}
                                                                    >
                                                                        <div className="flex items-center justify-between mb-2">
                                                                            <span className="font-bold text-slate-900 text-xs">
                                                                                Plaza Nº {plz.plazaNum} de {currentPos.plazasTotal}
                                                                            </span>
                                                                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${plz.status === 'Vacante' ? 'bg-emerald-100 text-emerald-800' : plz.status === 'Cubierta' ? 'bg-blue-100 text-blue-800' : 'bg-purple-100 text-purple-800'}`}>
                                                                                {plz.status}
                                                                            </span>
                                                                        </div>

                                                                        {plz.status === 'Cubierta' ? (
                                                                            <p className="text-xs text-slate-600">
                                                                                Ocupada por: <strong className="text-slate-900">{plz.candidateName}</strong>
                                                                            </p>
                                                                        ) : plz.status === 'En selección' ? (
                                                                            <p className="text-xs text-purple-800 font-medium">
                                                                                Preseleccionado: {plz.candidateName}
                                                                            </p>
                                                                        ) : (
                                                                            <p className="text-xs text-emerald-700 font-semibold flex items-center gap-1">
                                                                                <Check className="w-3.5 h-3.5" /> Disponible para asignación inmediata
                                                                            </p>
                                                                        )}
                                                                    </div>
                                                                );
                                                            })}
                                                        </div>

                                                        {/* Assignment Mode choice */}
                                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 mt-4 space-y-2">
                                                            <h5 className="font-bold text-slate-900 text-xs">Modalidad de Asignación:</h5>
                                                            <div className="flex items-center gap-4 text-xs">
                                                                <label className="flex items-center gap-2 cursor-pointer font-semibold text-slate-800">
                                                                    <input 
                                                                        type="radio" 
                                                                        name="assignMode" 
                                                                        value="plaza"
                                                                        checked={wizardState.assignmentMode === 'plaza'}
                                                                        onChange={() => setWizardState(prev => ({ ...prev, assignmentMode: 'plaza' }))}
                                                                        className="text-blue-600 focus:ring-blue-500"
                                                                    />
                                                                    <span>Asignar plaza directamente (Cubrir vacante)</span>
                                                                </label>
                                                                <label className="flex items-center gap-2 cursor-pointer font-semibold text-slate-800">
                                                                    <input 
                                                                        type="radio" 
                                                                        name="assignMode" 
                                                                        value="candidature"
                                                                        checked={wizardState.assignmentMode === 'candidature'}
                                                                        onChange={() => setWizardState(prev => ({ ...prev, assignmentMode: 'candidature' }))}
                                                                        className="text-blue-600 focus:ring-blue-500"
                                                                    />
                                                                    <span>Iniciar candidatura (En terna / entrevista previa)</span>
                                                                </label>
                                                            </div>
                                                        </div>
                                                    </>
                                                );
                                            })()}
                                        </div>
                                    )}

                                    {/* PASO 4: VALIDACIÓN, ALERTAS Y CONFIRMACIÓN */}
                                    {wizardState.step === 4 && (
                                        <div className="space-y-4">
                                            {(() => {
                                                const currentPet = petitions.find(p => p.id === wizardState.selectedPetitionId);
                                                const currentPos = currentPet?.positions.find(p => p.id === wizardState.selectedPositionId);
                                                const { blockers, warnings } = runWizardCompatibilityCheck(wizardState.selectedPetitionId, wizardState.selectedPositionId, wizardState.candidate);

                                                return (
                                                    <>
                                                        {/* Summary card */}
                                                        <div className="bg-slate-900 text-white p-4 rounded-xl flex items-start justify-between text-xs">
                                                            <div>
                                                                <p className="text-blue-300 font-semibold text-[10px] uppercase tracking-wider">Resumen de Asignación</p>
                                                                <h4 className="text-base font-bold text-white mt-0.5">
                                                                    {wizardState.candidate?.name} {wizardState.candidate?.lastName}
                                                                </h4>
                                                                <p className="text-slate-300 mt-1">
                                                                    Destino: <strong>{currentPet?.id} · {currentPet?.client}</strong>
                                                                </p>
                                                                <p className="text-slate-300">
                                                                    Posición: <strong>{currentPos?.title}</strong> · Plaza <strong>{wizardState.selectedPlazaNum}</strong>
                                                                </p>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="bg-blue-600 text-white font-bold px-2 py-0.5 rounded text-[10px]">
                                                                    {wizardState.assignmentMode === 'plaza' ? 'Asignación Directa' : 'Candidatura'}
                                                                </span>
                                                                <p className="text-slate-400 text-[11px] mt-2">Inicio: {currentPet?.startDate}</p>
                                                            </div>
                                                        </div>

                                                        {/* BLOCKERS (if any) */}
                                                        {blockers.length > 0 && (
                                                            <div className="bg-rose-50 border border-rose-300 rounded-xl p-4 text-xs">
                                                                <div className="flex items-center gap-2 text-rose-900 font-bold mb-2">
                                                                    <AlertOctagon className="w-4 h-4 text-rose-600" />
                                                                    <span>Incompatibilidades Críticas / Bloqueos Detectados ({blockers.length})</span>
                                                                </div>
                                                                <ul className="space-y-1.5 text-rose-800 list-disc list-inside">
                                                                    {blockers.map((b, idx) => (
                                                                        <li key={idx} className="font-medium">{b}</li>
                                                                    ))}
                                                                </ul>
                                                                <p className="text-[11px] text-rose-600 mt-2 font-semibold">
                                                                    * No se recomienda completar la asignación sin solventar estos requisitos previos (ej. renovar DNI o consentimientos).
                                                                </p>
                                                            </div>
                                                        )}

                                                        {/* WARNINGS (if any) */}
                                                        {warnings.length > 0 && (
                                                            <div className="bg-amber-50 border border-amber-300 rounded-xl p-4 text-xs">
                                                                <div className="flex items-center gap-2 text-amber-900 font-bold mb-2">
                                                                    <AlertTriangle className="w-4 h-4 text-amber-600" />
                                                                    <span>Advertencias y Verificaciones ({warnings.length})</span>
                                                                </div>
                                                                <ul className="space-y-1 text-amber-800 list-disc list-inside">
                                                                    {warnings.map((w, idx) => (
                                                                        <li key={idx}>{w}</li>
                                                                    ))}
                                                                </ul>
                                                            </div>
                                                        )}

                                                        {/* ALL OK Banner */}
                                                        {blockers.length === 0 && warnings.length === 0 && (
                                                            <div className="bg-emerald-50 border border-emerald-300 rounded-xl p-4 text-xs flex items-center gap-3">
                                                                <CheckCircle2 className="w-6 h-6 text-emerald-600 flex-shrink-0" />
                                                                <div>
                                                                    <h5 className="font-bold text-emerald-950">Validación de compatibilidad 100% OK</h5>
                                                                    <p className="text-emerald-800">
                                                                        El candidato cumple todos los requisitos formativos, documentación de identidad, RGPD y disponibilidad horaria para la plaza seleccionada.
                                                                    </p>
                                                                </div>
                                                            </div>
                                                        )}

                                                        {/* Optional Notes for Activity Log */}
                                                        <div>
                                                            <label className="text-xs font-semibold text-slate-700">Notas de asignación / Justificación (Opcional):</label>
                                                            <textarea 
                                                                value={wizardState.overrideReason}
                                                                onChange={(e) => setWizardState(prev => ({ ...prev, overrideReason: e.target.value }))}
                                                                placeholder="Añade cualquier observación sobre la incorporación o acuerdos con el cliente..."
                                                                className="w-full mt-1 p-2.5 text-xs bg-white border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                                                                rows={2}
                                                            />
                                                        </div>
                                                    </>
                                                );
                                            })()}
                                        </div>
                                    )}
                                </div>

                                {/* Wizard Footer Navigation */}
                                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between flex-shrink-0 text-xs">
                                    {wizardState.step > 1 ? (
                                        <button 
                                            onClick={() => setWizardState(prev => ({ ...prev, step: prev.step - 1 }))}
                                            className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold flex items-center gap-1"
                                        >
                                            <ChevronLeft className="w-4 h-4" /> Anterior
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => setWizardState(prev => ({ ...prev, isOpen: false }))}
                                            className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold"
                                        >
                                            Cancelar
                                        </button>
                                    )}

                                    {wizardState.step < 4 ? (
                                        <button 
                                            onClick={() => setWizardState(prev => ({ ...prev, step: prev.step + 1 }))}
                                            className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm flex items-center gap-1.5"
                                        >
                                            Siguiente <ChevronRight className="w-4 h-4" />
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={confirmAssignmentWizard}
                                            className="px-6 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-lg shadow-md flex items-center gap-2"
                                        >
                                            <Check className="w-4 h-4" /> Confirmar Asignación
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================================================== */}
                    {/* 6. MODAL: CONTACTAR CANDIDATO (PHONE, SMS, WHATSAPP) */}
                    {/* ==================================================== */}
                    {contactModalCandidate && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden flex flex-col animate-in zoom-in-95 duration-200">
                                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                                    <div>
                                        <h3 className="font-bold text-base flex items-center gap-2">
                                            <PhoneCall className="w-4 h-4 text-blue-400" />
                                            Contactar Candidato
                                        </h3>
                                        <p className="text-xs text-slate-300 mt-0.5">
                                            {contactModalCandidate.name} {contactModalCandidate.lastName} · {contactModalCandidate.phone}
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setContactModalCandidate(null)}
                                        className="text-slate-400 hover:text-white"
                                    >
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="p-6 space-y-4 text-xs">
                                    {/* Channel Selector */}
                                    <div>
                                        <label className="font-bold text-slate-700 block mb-1.5">Canal de Comunicación:</label>
                                        <div className="grid grid-cols-4 gap-2">
                                            {[
                                                { id: 'Llamada', label: 'Llamada', icon: Phone },
                                                { id: 'WhatsApp', label: 'WhatsApp', icon: MessageSquare },
                                                { id: 'Email', label: 'Email', icon: Mail },
                                                { id: 'SMS', label: 'SMS', icon: Smartphone }
                                            ].map(ch => {
                                                const Icon = ch.icon;
                                                const isSel = contactChannel === ch.id;
                                                return (
                                                    <button 
                                                        key={ch.id}
                                                        type="button"
                                                        onClick={() => setContactChannel(ch.id)}
                                                        className={`p-2.5 rounded-lg border text-center font-semibold flex flex-col items-center gap-1 transition ${isSel ? 'border-blue-600 bg-blue-50 text-blue-700' : 'border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                                    >
                                                        <Icon className="w-4 h-4" />
                                                        <span>{ch.label}</span>
                                                    </button>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {/* Template Selector */}
                                    <div>
                                        <label className="font-bold text-slate-700 block mb-1">Plantilla rápida:</label>
                                        <select 
                                            value={contactTemplate}
                                            onChange={(e) => {
                                                const val = e.target.value;
                                                setContactTemplate(val);
                                                if (val === 'entrevista') {
                                                    setContactMessage(`Hola ${contactModalCandidate.name}, te contactamos de Talentia Express ETT para convocarte a una entrevista para vacante de logística en Coslada.`);
                                                } else if (val === 'renovacionDoc') {
                                                    setContactMessage(`Estimado/a ${contactModalCandidate.name}, te recordamos la necesidad de aportar documento de identidad renovado para mantener activas tus candidaturas en TramitNow ETT.`);
                                                } else if (val === 'ofertaUrgente') {
                                                    setContactMessage(`¡Oferta urgente de turno en Coslada! Buscamos operario para incorporación el próximo lunes. Confírmanos tu disponibilidad.`);
                                                }
                                            }}
                                            className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs"
                                        >
                                            <option value="libre">Mensaje libre / Personalizado</option>
                                            <option value="entrevista">Convocatoria a Entrevista Técnica</option>
                                            <option value="renovacionDoc">Solicitud Renovación Documental / DNI</option>
                                            <option value="ofertaUrgente">Oferta Urgente Incorporación Inmediata</option>
                                        </select>
                                    </div>

                                    {/* Message Body */}
                                    <div>
                                        <label className="font-bold text-slate-700 block mb-1">Mensaje / Guión de conversación:</label>
                                        <textarea 
                                            value={contactMessage}
                                            onChange={(e) => setContactMessage(e.target.value)}
                                            rows={3}
                                            className="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500"
                                        />
                                    </div>

                                    {/* Result Selector */}
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="font-bold text-slate-700 block mb-1">Resultado de la acción:</label>
                                            <select 
                                                value={contactResult}
                                                onChange={(e) => setContactResult(e.target.value)}
                                                className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs font-medium"
                                            >
                                                <option value="Interesado y disponible">Interesado y disponible</option>
                                                <option value="Citado para entrevista">Citado para entrevista</option>
                                                <option value="No contesta / Buzón">No contesta / Buzón</option>
                                                <option value="No disponible temporalmente">No disponible temporalmente</option>
                                                <option value="Rechaza oferta">Rechaza oferta / Desinteresado</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="font-bold text-slate-700 block mb-1">Nota interna para la ficha:</label>
                                            <input 
                                                type="text"
                                                value={contactNote}
                                                onChange={(e) => setContactNote(e.target.value)}
                                                placeholder="Ej. Prefiere turno de mañana..."
                                                className="w-full p-2 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>
                                </div>

                                <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs">
                                    <button 
                                        onClick={() => setContactModalCandidate(null)}
                                        className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold"
                                    >
                                        Cancelar
                                    </button>
                                    <button 
                                        onClick={submitContactAction}
                                        className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm flex items-center gap-1.5"
                                    >
                                        <Send className="w-3.5 h-3.5" /> Guardar Actividad
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ==================================================== */}
                    {/* 7. MODAL: ALTA RÁPIDA DE CANDIDATO                   */}
                    {/* ==================================================== */}
                    {isQuickCreateOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in zoom-in-95 duration-200">
                                <form onSubmit={handleQuickCreateSubmit}>
                                    <div className="p-5 bg-gradient-to-r from-blue-700 to-indigo-700 text-white flex items-center justify-between">
                                        <div>
                                            <h3 className="font-bold text-base flex items-center gap-2">
                                                <UserPlus className="w-5 h-5 text-blue-200" />
                                                Alta Rápida de Candidato
                                            </h3>
                                            <p className="text-xs text-blue-100 mt-0.5">
                                                Crea la ficha básica y completa el perfil profesional después.
                                            </p>
                                        </div>
                                        <button 
                                            type="button"
                                            onClick={() => setIsQuickCreateOpen(false)}
                                            className="text-blue-200 hover:text-white"
                                        >
                                            <X className="w-5 h-5" />
                                        </button>
                                    </div>

                                    <div className="p-6 space-y-3.5 text-xs">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Nombre *</label>
                                                <input required name="name" type="text" placeholder="Ej. Sergio" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Apellidos *</label>
                                                <input required name="lastName" type="text" placeholder="Ej. Marín López" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Documento Identidad (DNI/NIE) *</label>
                                                <input required name="dni" type="text" placeholder="12345678Z" className="w-full p-2 border border-slate-300 rounded-lg font-mono text-xs uppercase" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Caducidad DNI</label>
                                                <input name="dniExpiry" type="date" defaultValue="2028-12-31" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Teléfono Móvil *</label>
                                                <input required name="phone" type="tel" placeholder="+34 600 000 000" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Correo Electrónico *</label>
                                                <input required name="email" type="email" placeholder="candidato@email.com" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Población</label>
                                                <input name="city" type="text" defaultValue="Coslada" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Provincia</label>
                                                <input name="province" type="text" defaultValue="Madrid" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Categoría Principal</label>
                                                <select name="category" className="w-full p-2 border border-slate-300 rounded-lg text-xs">
                                                    <option value="Operario de almacén / Mozo">Operario de almacén / Mozo</option>
                                                    <option value="Carretillero / Mozo especializado">Carretillero / Mozo especializado</option>
                                                    <option value="Reponedor / Carga y descarga">Reponedor / Carga y descarga</option>
                                                    <option value="Conductor / Repartidor">Conductor / Repartidor</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="font-bold text-slate-700 block mb-1">Años Experiencia</label>
                                                <input name="experience" type="number" defaultValue="2" min="0" max="40" className="w-full p-2 border border-slate-300 rounded-lg text-xs" />
                                            </div>
                                        </div>

                                        <div>
                                            <label className="font-bold text-slate-700 block mb-1">Nº Seguridad Social (NSS)</label>
                                            <input name="nss" type="text" placeholder="28/12345678/90 (Opcional en alta rápida)" className="w-full p-2 border border-slate-300 rounded-lg font-mono text-xs" />
                                        </div>

                                        <div className="pt-2 border-t border-slate-100 space-y-2">
                                            <label className="flex items-center gap-2 cursor-pointer font-medium text-slate-700">
                                                <input name="hasForklift" type="checkbox" defaultChecked className="rounded text-blue-600 focus:ring-blue-500" />
                                                <span>Dispone de Carnet de Carretillero UNE 58451</span>
                                            </label>
                                            <label className="flex items-center gap-2 cursor-pointer font-bold text-emerald-800">
                                                <input name="rgpdAccept" type="checkbox" defaultChecked className="rounded text-emerald-600 focus:ring-emerald-500" />
                                                <span>Acepta cláusula de tratamiento y cesión de datos RGPD Talentia Express</span>
                                            </label>
                                        </div>
                                    </div>

                                    <div className="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs">
                                        <button 
                                            type="button"
                                            onClick={() => setIsQuickCreateOpen(false)}
                                            className="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-100 font-semibold"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-lg shadow-sm flex items-center gap-1.5"
                                        >
                                            <Check className="w-4 h-4" /> Crear Candidato
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* ==================================================== */}
                    {/* 8. MODAL: IMPORTAR DESDE PORTALES DE EMPLEO          */}
                    {/* ==================================================== */}
                    {isImportPortalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden animate-in zoom-in-95 duration-200">
                                <div className="p-5 bg-slate-900 text-white flex items-center justify-between">
                                    <div>
                                        <h3 className="font-bold text-base flex items-center gap-2">
                                            <UploadCloud className="w-5 h-5 text-blue-400" />
                                            Importar Candidatos desde Portales
                                        </h3>
                                        <p className="text-xs text-slate-300 mt-0.5">
