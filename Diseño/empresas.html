        ],

        ],

      {

        createdAt: '2026-02-14',
        contacts: [
          { id: 'cont-401', name: 'Sergi Pujol', email: 'spujol@premiumeventsbcn.cat', phone: '+34 688 990 011', role: 'Coordinador de Eventos', types: ['Comercial', 'Operativo'], isMain: true, isQuoteRecipient: true }
        ],
        centers: [
          { id: 'cent-401', name: 'Palau de Congressos BCN', address: 'Av. Diagonal 661', postalCode: '08028', city: 'Barcelona', country: 'España', notes: 'Acceso puerta de proveedores c/ Martí i Franquès' }
        ],
        billing: { isComplete: false },
        activity: []
      }
    ];

    function App() {
      // Estado de datos
      const [companies, setCompanies] = useState(INITIAL_COMPANIES);
      const [selectedCompanyId, setSelectedCompanyId] = useState('comp-1');
      const [activeTab, setActiveTab] = useState('resumen'); // 'resumen' | 'datos' | 'contactos' | 'centros' | 'facturacion' | 'documentos' | 'actividad'
      
      // Filtros del listado
      const [searchTerm, setSearchTerm] = useState('');
      const [filterStatus, setFilterStatus] = useState('all');
      const [filterOwner, setFilterOwner] = useState('all');
      const [filterReadiness, setFilterReadiness] = useState('all');

      // Contexto simulado (ej: abierto desde Presupuesto)
      const [simulationContext, setSimulationContext] = useState({
        active: true,
        code: 'Presupuesto PRE-2026-0048',
        role: 'Consultor Comercial ETT',
        origin: 'Negociación tarifa carretilleros turno noche'
      });

      // Drawers / Modales
      const [drawerState, setDrawerState] = useState({
        isOpen: false,
        type: null, // 'new-company' | 'edit-company' | 'new-contact' | 'edit-contact' | 'new-center' | 'edit-center'
        data: null,
        hasUnsavedChanges: false
      });

      const [discardModalOpen, setDiscardModalOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [showRulesDrawer, setShowRulesDrawer] = useState(false);
      const [viewMode, setViewMode] = useState('detail'); // 'list' | 'detail'

      // Obtener empresa activa
      const currentCompany = useMemo(() => {
        return companies.find(c => c.id === selectedCompanyId) || companies[0];
      }, [companies, selectedCompanyId]);

      // Toast helper
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3800);
      };

      // Manejar cierre de panel con confirmación si hay cambios
      const handleCloseDrawer = (force = false) => {
        if (!force && drawerState.hasUnsavedChanges) {
          setDiscardModalOpen(true);
        } else {
          setDrawerState({ isOpen: false, type: null, data: null, hasUnsavedChanges: false });
          setDiscardModalOpen(false);
        }
      };

      // Guardado de empresa rápida
      const handleSaveCompany = (formData, isEdit = false) => {
        if (isEdit) {
          setCompanies(prev => prev.map(c => {
            if (c.id === currentCompany.id) {
              return {
                ...c,
                ...formData,
                activity: [
                  {
                    id: 'act-' + Date.now(),
                    date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                    user: 'Carlos Mendoza',
                    action: 'Datos de empresa actualizados desde el panel lateral',
                    type: 'system'
                  },
                  ...c.activity
                ]
              };
            }
            return c;
          }));
          showToast('Empresa actualizada correctamente');
        } else {
          const newId = 'comp-' + Date.now();
          const newComp = {
            id: newId,
            cif: formData.cif,
            name: formData.name,
            tradeName: formData.tradeName || formData.name,
            status: 'active',
            readiness: { basic: true, quote: false, operations: false, billing: false },
            readinessLabel: 'Alta básica (Falta contacto)',
            readinessStep: 1,
            owner: formData.owner || 'Carlos Mendoza',
            country: formData.country || 'España',
            email: formData.email || '',
            phone: formData.phone || '',
            address: formData.address || '',
            postalCode: formData.postalCode || '',
            city: formData.city || '',
            province: formData.province || '',
            sector: formData.sector || 'General',
            notes: formData.notes || '',
            lastActivity: 'Ahora — Alta rápida creada',
            createdAt: new Date().toISOString().substring(0, 10),
            contacts: [],
            centers: [],
            billing: { isComplete: false },
            activity: [
              {
                id: 'act-' + Date.now(),
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                user: formData.owner || 'Carlos Mendoza',
                action: 'Alta rápida inicial registrada en ERP',
                type: 'system'
              }
            ]
          };
          setCompanies(prev => [newComp, ...prev]);
          setSelectedCompanyId(newId);
          setViewMode('detail');
          setActiveTab('resumen');
          showToast('Empresa creada con éxito (Borrador inicial)');
        }
        setDrawerState({ isOpen: false, type: null, data: null, hasUnsavedChanges: false });
      };

      // Guardar Contacto
      const handleSaveContact = (contactData, isEdit = false) => {
        setCompanies(prev => prev.map(c => {
          if (c.id === currentCompany.id) {
            let updatedContacts;
            if (isEdit) {
              updatedContacts = c.contacts.map(ct => ct.id === contactData.id ? contactData : (contactData.isMain ? { ...ct, isMain: false } : ct));
            } else {
              const newContact = { ...contactData, id: 'cont-' + Date.now() };
              updatedContacts = contactData.isMain 
                ? [newContact, ...c.contacts.map(ct => ({ ...ct, isMain: false }))]
                : [...c.contacts, newContact];
            }

            // Actualizar readiness si ya tiene contacto principal
            const hasQuoteContact = updatedContacts.some(ct => ct.isQuoteRecipient || ct.isMain);
            const newReadiness = {
              ...c.readiness,
              quote: hasQuoteContact
            };

            let label = c.readinessLabel;
            if (newReadiness.quote && !newReadiness.operations) {
              label = 'Lista para presupuestar';
            }

            return {
              ...c,
              contacts: updatedContacts,
              readiness: newReadiness,
              readinessLabel: label,
              activity: [
                {
                  id: 'act-' + Date.now(),
                  date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                  user: 'Carlos Mendoza',
                  action: isEdit ? `Contacto modificado: ${contactData.name}` : `Nuevo contacto añadido: ${contactData.name} (${contactData.types.join(', ')})`,
                  type: 'contact'
                },
                ...c.activity
              ]
            };
          }
          return c;
        }));
        showToast(isEdit ? 'Contacto actualizado' : 'Contacto añadido y vinculado a presupuesto');
        setDrawerState({ isOpen: false, type: null, data: null, hasUnsavedChanges: false });
      };

      // Guardar Centro
      const handleSaveCenter = (centerData, isEdit = false) => {
        setCompanies(prev => prev.map(c => {
          if (c.id === currentCompany.id) {
            let updatedCenters;
            if (isEdit) {
              updatedCenters = c.centers.map(ct => ct.id === centerData.id ? centerData : ct);
            } else {
              const newCenter = { ...centerData, id: 'cent-' + Date.now() };
              updatedCenters = [...c.centers, newCenter];
            }

            const hasCenters = updatedCenters.length > 0;
            const newReadiness = {
              ...c.readiness,
              operations: hasCenters
            };

            let label = c.readinessLabel;
            if (newReadiness.operations && newReadiness.quote) {
              label = newReadiness.billing ? 'Facturación y Operativa listas' : 'Petición operativa lista';
            }

            return {
              ...c,
              centers: updatedCenters,
              readiness: newReadiness,
              readinessLabel: label,
              activity: [
                {
                  id: 'act-' + Date.now(),
                  date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                  user: 'Carlos Mendoza',
                  action: isEdit ? `Centro de trabajo modificado: ${centerData.name}` : `Nuevo centro operativo añadido: ${centerData.name}`,
                  type: 'center'
                },
                ...c.activity
              ]
            };
          }
          return c;
        }));
        showToast(isEdit ? 'Centro actualizado' : 'Centro operativo creado (desbloquea Petición)');
        setDrawerState({ isOpen: false, type: null, data: null, hasUnsavedChanges: false });
      };

      // Filtrado en tabla
      const filteredCompanies = useMemo(() => {
        return companies.filter(c => {
          const matchSearch = c.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            c.cif.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (c.tradeName && c.tradeName.toLowerCase().includes(searchTerm.toLowerCase()));
          const matchStatus = filterStatus === 'all' || c.status === filterStatus;
          const matchOwner = filterOwner === 'all' || c.owner.toLowerCase().includes(filterOwner.toLowerCase());
          const matchReadiness = filterReadiness === 'all' || 
            (filterReadiness === 'quote' && c.readiness.quote) ||
            (filterReadiness === 'operations' && c.readiness.operations) ||
            (filterReadiness === 'billing' && c.readiness.billing);
          return matchSearch && matchStatus && matchOwner && matchReadiness;
        });
      }, [companies, searchTerm, filterStatus, filterOwner, filterReadiness]);

      return (
        <div className="flex h-screen bg-slate-100 overflow-hidden text-sm">
          {/* TOAST FLOTANTE */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 flex items-center gap-2.5 bg-slate-900 text-white px-4 py-3 rounded-lg shadow-xl border border-slate-800 animate-bounce">
              <CheckCircle2 className="w-5 h-5 text-emerald-400 shrink-0" />
              <span className="font-medium text-xs md:text-sm">{toast.message}</span>
              <button onClick={() => setToast(null)} className="text-slate-400 hover:text-white ml-2">
                <X className="w-4 h-4" />
              </button>
            </div>
          )}

          {/* BARRA LATERAL DEL SISTEMA ERP (SaaS Navigation) */}
          <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0 border-r border-slate-800">
            {/* Logo ETT */}
            <div className="p-4 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950 font-black tracking-tight text-base shadow-sm">
                  ETT
                </div>
                <div>
                  <h1 className="font-bold text-white text-sm leading-tight">Gestión ETT Cloud</h1>
                  <span className="text-[10px] text-emerald-400 font-semibold uppercase tracking-wider">Módulo Comercial v2.4</span>
                </div>
              </div>
            </div>

            {/* Menú principal de la app */}
            <nav className="p-3 space-y-1 flex-1 overflow-y-auto">
              <div className="px-3 py-1.5 text-[11px] font-semibold text-slate-300 uppercase tracking-wider">
                Área Comercial & ETT
              </div>

              <button 
                onClick={() => { setViewMode('list'); }}
                className={`w-full flex items-center justify-between px-3 py-2 rounded-md font-medium transition ${
                  viewMode === 'list' 
                    ? 'bg-emerald-600 text-white shadow-sm' 
                    : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                }`}
              >
                <div className="flex items-center gap-2.5">
                  <Building2 className="w-4 h-4" />
                  <span>Empresas / Clientes</span>
                </div>
                <span className="text-xs bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded font-mono">
                  {companies.length}
                </span>
              </button>

              <button 
                onClick={() => {
                  setSelectedCompanyId('comp-1');
                  setViewMode('detail');
                }}
                className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-md font-medium transition ${
                  viewMode === 'detail' 
                    ? 'bg-slate-800 text-emerald-400 font-semibold' 
                    : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                }`}
              >
                <FileText className="w-4 h-4" />
                <span className="truncate text-xs">Ficha activa: Trans-Logística</span>
              </button>

              <div className="pt-3 px-3 py-1.5 text-[11px] font-semibold text-slate-300 uppercase tracking-wider">
                Flujo Operativo
              </div>

              <div className="px-3 py-1.5 text-xs text-slate-300 flex items-center gap-2 opacity-90 cursor-not-allowed">
                <FileCheck className="w-4 h-4" />
                <span>1. Presupuestos ETT</span>
              </div>
              <div className="px-3 py-1.5 text-xs text-slate-300 flex items-center gap-2 opacity-90 cursor-not-allowed">
                <Layers className="w-4 h-4" />
                <span>2. Peticiones de personal</span>
              </div>
              <div className="px-3 py-1.5 text-xs text-slate-300 flex items-center gap-2 opacity-90 cursor-not-allowed">
                <Users className="w-4 h-4" />
                <span>3. Candidatos & Contratos</span>
              </div>
              <div className="px-3 py-1.5 text-xs text-slate-300 flex items-center gap-2 opacity-90 cursor-not-allowed">
                <CreditCard className="w-4 h-4" />
                <span>4. Facturación & Nóminas</span>
              </div>
            </nav>

            {/* Widget de Reglas UX & Ayuda al usuario */}
            <div className="p-3 border-t border-slate-800 bg-slate-950/40">
              <button
                onClick={() => setShowRulesDrawer(true)}
                className="w-full bg-slate-800/80 hover:bg-slate-800 text-slate-300 hover:text-white p-2.5 rounded-md border border-slate-700/60 text-left flex items-start gap-2.5 transition group"
              >
                <Sparkles className="w-4 h-4 text-emerald-400 mt-0.5 shrink-0 group-hover:scale-110 transition-transform" />
                <div>
                  <div className="text-xs font-semibold text-slate-200">Reglas UX Aplicadas</div>
                  <div className="text-[11px] text-slate-400 leading-tight mt-0.5">
                    Descubre por qué solo pedimos 5 campos al inicio.
                  </div>
                </div>
              </button>
            </div>

            {/* Usuario actual */}
            <div className="p-3 border-t border-slate-800 flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-slate-200">
                CM
              </div>
              <div className="overflow-hidden">
                <div className="text-xs font-semibold text-slate-200 truncate">Carlos Mendoza</div>
                <div className="text-[10px] text-slate-400 truncate">Consultor Comercial ETT</div>
              </div>
            </div>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <main className="flex-1 flex flex-col min-w-0 overflow-hidden">
            
            {/* BANDA DE CONTEXTO ACTIVO (Simulación de Presupuesto) */}
            {simulationContext.active && (
              <div className="bg-amber-500/10 border-b border-amber-200/80 px-4 py-1.5 flex items-center justify-between text-xs text-amber-900 shrink-0">
                <div className="flex items-center gap-2">
                  <span className="flex h-2 w-2 relative">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                  </span>
                  <span className="font-medium text-amber-950">Contexto activo:</span>
                  <span className="bg-amber-200/70 text-amber-900 px-2 py-0.5 rounded font-mono font-bold text-[11px]">
                    {simulationContext.code}
                  </span>
                  <span className="text-amber-800 hidden md:inline">
                    — Editando empresa sin salir del flujo de venta
                  </span>
                </div>
                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setSimulationContext(prev => ({ ...prev, active: false }))}
                    className="text-amber-700 hover:text-amber-950 text-[11px] underline font-medium"
                  >
                    Ocultar aviso de contexto
                  </button>
                </div>
              </div>
            )}

            {/* TOP HEADER */}
            <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0">
              <div className="flex items-center gap-3">
                {viewMode === 'detail' && (
                  <button
                    onClick={() => setViewMode('list')}
                    className="p-1.5 hover:bg-slate-100 rounded-md text-slate-500 hover:text-slate-800 transition mr-1"
                    title="Volver al listado de empresas"
                  >
                    <ArrowLeft className="w-4 h-4" />
                  </button>
                )}
                <div>
                  <div className="flex items-center gap-2">
                    <h2 className="text-base font-bold text-slate-900">
                      {viewMode === 'list' ? 'Directorio de Empresas & Clientes' : currentCompany.name}
                    </h2>
                    {viewMode === 'detail' && (
                      <span className="bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-full text-[11px] font-medium flex items-center gap-1">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                        Cliente activo
                      </span>
                    )}
                  </div>
                  <p className="text-xs text-slate-500 mt-0.5">
                    {viewMode === 'list' 
                      ? 'Base de clientes, prospectos y estado de preparación comercial/operativa.'
                      : `CIF: ${currentCompany.cif} • Responsable: ${currentCompany.owner} • ${currentCompany.city || 'Ubicación sin definir'}`}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {viewMode === 'detail' ? (
                  <>
                    <button
                      onClick={() => setDrawerState({ isOpen: true, type: 'edit-company', data: currentCompany, hasUnsavedChanges: false })}
                      className="px-3 py-1.5 border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium rounded-md text-xs flex items-center gap-1.5 transition"
                    >
                      <Edit3 className="w-3.5 h-3.5 text-slate-500" />
                      Editar Ficha
                    </button>

                    <button
                      onClick={() => setDrawerState({ isOpen: true, type: 'new-contact', data: null, hasUnsavedChanges: false })}
                      className="px-3 py-1.5 border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium rounded-md text-xs flex items-center gap-1.5 transition"
                    >
                      <Plus className="w-3.5 h-3.5 text-slate-500" />
                      Contacto
                    </button>

                    <button
                      onClick={() => setDrawerState({ isOpen: true, type: 'new-center', data: null, hasUnsavedChanges: false })}
                      className="px-3 py-1.5 border border-slate-300 hover:bg-slate-50 text-slate-700 font-medium rounded-md text-xs flex items-center gap-1.5 transition"
                    >
                      <Plus className="w-3.5 h-3.5 text-slate-500" />
                      Centro
                    </button>

                    <button
                      onClick={() => showToast(`Iniciando presupuesto para ${currentCompany.name}...`)}
                      className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-md text-xs flex items-center gap-1.5 shadow-sm transition"
                    >
                      <FileCheck className="w-3.5 h-3.5" />
                      Crear Presupuesto
                    </button>
                  </>
                ) : (
                  <button
                    onClick={() => setDrawerState({ isOpen: true, type: 'new-company', data: null, hasUnsavedChanges: false })}
                    className="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-md text-xs flex items-center gap-1.5 shadow-sm transition"
                  >
                    <Plus className="w-4 h-4" />
                    + Nueva Empresa (Alta Rápida)
                  </button>
                )}
              </div>
            </header>

            {/* VISTA 1: LISTADO DE EMPRESAS */}
            {viewMode === 'list' && (
              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                
                {/* BARRA DE FILTROS */}
                <div className="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                  <div className="flex flex-wrap items-center gap-3 flex-1 min-w-[280px]">
                    <div className="relative flex-1 max-w-md">
                      <Search className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" />
                      <input 
                        type="text" 
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        placeholder="Buscar por Razón Social, Nombre Comercial o CIF..."
                        className="w-full pl-9 pr-3 py-1.5 text-xs border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
                      />
                    </div>

                    <div className="flex items-center gap-2">
                      <select 
                        value={filterReadiness}
                        onChange={(e) => setFilterReadiness(e.target.value)}
                        className="text-xs border border-slate-300 rounded-md px-2.5 py-1.5 bg-white text-slate-700 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                      >
                        <option value="all">Estado preparación: Todos</option>
                        <option value="quote">Listas para presupuestar</option>
                        <option value="operations">Listas para operativa</option>
                        <option value="billing">Listas para facturar</option>
                      </select>

                      <select 
                        value={filterOwner}
                        onChange={(e) => setFilterOwner(e.target.value)}
                        className="text-xs border border-slate-300 rounded-md px-2.5 py-1.5 bg-white text-slate-700 focus:outline-none focus:ring-1 focus:ring-emerald-500"
                      >
                        <option value="all">Responsable: Todos</option>
                        <option value="carlos">Carlos Mendoza</option>
                        <option value="elena">Elena Rivas</option>
                        <option value="laura">Laura Vidal</option>
                      </select>
                    </div>
                  </div>

                  <div className="text-xs text-slate-500">
                    Mostrando <strong className="text-slate-800">{filteredCompanies.length}</strong> de {companies.length} empresas
                  </div>
                </div>

                {/* TABLA PRINCIPAL DE EMPRESAS */}
                <div className="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase tracking-wider font-semibold">
                        <tr>
                          <th className="py-3 px-4">Empresa / Razón Social</th>
                          <th className="py-3 px-4">CIF / NIF</th>
                          <th className="py-3 px-4">Contacto Principal</th>
                          <th className="py-3 px-4">Estado de Preparación</th>
                          <th className="py-3 px-4">Responsable ETT</th>
                          <th className="py-3 px-4">Última Actividad</th>
                          <th className="py-3 px-4 text-right">Acciones</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200 text-slate-700">
                        {filteredCompanies.length === 0 ? (
                          <tr>
                            <td colSpan="7" className="py-12 text-center text-slate-400">
                              <Building2 className="w-8 h-8 mx-auto mb-2 opacity-40" />
                              No se encontraron empresas con los filtros aplicados.
                            </td>
                          </tr>
                        ) : (
                          filteredCompanies.map(company => {
                            const mainContact = company.contacts.find(c => c.isMain) || company.contacts[0];
                            return (
                              <tr 
                                key={company.id}
                                className="hover:bg-slate-50/80 transition group cursor-pointer"
                                onClick={() => {
                                  setSelectedCompanyId(company.id);
                                  setViewMode('detail');
                                }}
                              >
                                <td className="py-3.5 px-4">
                                  <div className="font-bold text-slate-900 group-hover:text-emerald-700 flex items-center gap-1.5">
                                    {company.name}
                                    {company.id === 'comp-1' && (
                                      <span className="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-200 px-1.5 py-0.2 rounded font-normal">
                                        Empresa Caso Demo
                                      </span>
                                    )}
                                  </div>
                                  {company.tradeName && company.tradeName !== company.name && (
                                    <div className="text-[11px] text-slate-400">Nombre com.: {company.tradeName}</div>
                                  )}
                                  <div className="text-[11px] text-slate-500 mt-0.5">{company.sector}</div>
                                </td>

                                <td className="py-3.5 px-4 font-mono text-slate-600 font-medium">
                                  {company.cif}
                                </td>

                                <td className="py-3.5 px-4">
                                  {mainContact ? (
                                    <div>
                                      <div className="font-medium text-slate-800">{mainContact.name}</div>
                                      <div className="text-[11px] text-slate-400">{mainContact.email || mainContact.phone}</div>
                                    </div>
                                  ) : (
                                    <span className="text-amber-600 italic flex items-center gap-1 text-[11px]">
                                      <AlertTriangle className="w-3 h-3" /> Sin contacto aún
                                    </span>
                                  )}
                                </td>

                                <td className="py-3.5 px-4">
                                  <div className="space-y-1">
                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium border ${
                                      company.readiness.quote 
                                        ? 'bg-emerald-50 text-emerald-700 border-emerald-200'
                                        : 'bg-amber-50 text-amber-700 border-amber-200'
                                    }`}>
                                      {company.readiness.quote ? (
                                        <CheckCircle2 className="w-3 h-3 text-emerald-600" />
                                      ) : (
                                        <Clock className="w-3 h-3 text-amber-600" />
                                      )}
                                      {company.readinessLabel}
                                    </span>

                                    {/* Indicadores visuales de paso */}
                                    <div className="flex items-center gap-1 text-[10px] text-slate-400">
                                      <span className="text-emerald-600 font-semibold">Alta ✓</span>
                                      <span>•</span>
                                      <span className={company.readiness.quote ? 'text-emerald-600 font-semibold' : 'text-slate-400'}>Presupuesto {company.readiness.quote ? '✓' : '...'}</span>
                                      <span>•</span>
                                      <span className={company.readiness.operations ? 'text-emerald-600 font-semibold' : 'text-slate-400'}>Operativa {company.readiness.operations ? '✓' : '...'}</span>
                                      <span>•</span>
                                      <span className={company.readiness.billing ? 'text-emerald-600 font-semibold' : 'text-slate-400'}>Factura {company.readiness.billing ? '✓' : '...'}</span>
                                    </div>
                                  </div>
                                </td>

                                <td className="py-3.5 px-4 text-slate-600">
                                  {company.owner}
                                </td>

                                <td className="py-3.5 px-4 text-slate-500 text-[11px]">
                                  {company.lastActivity}
                                </td>

                                <td className="py-3.5 px-4 text-right" onClick={(e) => e.stopPropagation()}>
                                  <div className="flex items-center justify-end gap-1">
                                    <button
                                      onClick={() => {
                                        setSelectedCompanyId(company.id);
                                        setViewMode('detail');
                                      }}
                                      className="px-2.5 py-1 text-slate-600 hover:text-emerald-700 hover:bg-slate-100 rounded text-xs font-medium transition"
                                    >
                                      Abrir Ficha 360º
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            );
                          })
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>

                {/* CALLOUT INFORMATIVO */}
                <div className="bg-emerald-50 border border-emerald-200 rounded-lg p-3.5 flex items-start gap-3 text-xs text-emerald-900">
                  <Info className="w-4 h-4 text-emerald-600 mt-0.5 shrink-0" />
                  <div>
                    <span className="font-semibold">Filosofía de Alta Progresiva ETT:</span> Puedes crear un presupuesto de tarifas y márgenes para <strong>Trans-Logística Ibérica Norte, S.L.</strong> de inmediato con los datos actuales. No bloqueamos la venta pidiendo centros operativos, IBAN ni convenios hasta que el cliente realmente acepte la propuesta.
                  </div>
                </div>

              </div>
            )}

            {/* VISTA 2: FICHA 360º DE LA EMPRESA */}
            {viewMode === 'detail' && (
              <div className="flex-1 flex flex-col min-h-0 bg-slate-50">
                
                {/* HEADER DE LA FICHA 360º */}
                <div className="bg-white border-b border-slate-200 px-6 pt-4 pb-0 shrink-0">
                  <div className="flex flex-wrap items-center justify-between gap-4 pb-4">
                    <div className="flex items-start gap-3">
                      <div className="w-12 h-12 rounded-xl bg-slate-900 text-white flex items-center justify-center font-bold text-lg shadow-sm">
                        {currentCompany.name.substring(0, 2).toUpperCase()}
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h1 className="text-lg font-bold text-slate-900 leading-tight">
                            {currentCompany.name}
                          </h1>
                          <span className="font-mono text-xs bg-slate-100 text-slate-700 px-2 py-0.5 rounded border border-slate-200 font-semibold">
                            CIF: {currentCompany.cif}
                          </span>
                        </div>
                        <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500 mt-1">
                          <span className="flex items-center gap-1">
                            <MapPin className="w-3.5 h-3.5 text-slate-400" />
                            {currentCompany.city ? `${currentCompany.city} (${currentCompany.province})` : 'Sin dirección fiscal'}
                          </span>
                          <span className="flex items-center gap-1">
                            <Briefcase className="w-3.5 h-3.5 text-slate-400" />
                            {currentCompany.sector || 'Sector no especificado'}
                          </span>
                          <span className="flex items-center gap-1">
                            <Users className="w-3.5 h-3.5 text-slate-400" />
                            Responsable: <strong>{currentCompany.owner}</strong>
                          </span>
                        </div>
                      </div>
                    </div>

                    {/* Resumen rápido de Readiness */}
                    <div className="bg-slate-50 border border-slate-200 rounded-lg p-2.5 flex items-center gap-3">
                      <div className="text-right">
                        <div className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Estado funcional</div>
                        <div className="text-xs font-bold text-slate-800">{currentCompany.readinessLabel}</div>
                      </div>
                      <div className="h-7 w-[1px] bg-slate-200"></div>
                      <div className="flex items-center gap-1">
                        <span className="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center text-[10px] font-bold" title="Alta básica OK">1</span>
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ${currentCompany.readiness.quote ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'}`} title="Presupuesto">2</span>
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ${currentCompany.readiness.operations ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`} title="Operativa / Centros">3</span>
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ${currentCompany.readiness.billing ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-400'}`} title="Facturación">4</span>
                      </div>
                    </div>
                  </div>

                  {/* PESTAÑAS FUNCIONALES */}
                  <div className="flex items-center space-x-1 border-t border-slate-200 -mb-[1px] overflow-x-auto">
                    {[
                      { id: 'resumen', label: 'Resumen Funcional', icon: Layers },
                      { id: 'datos', label: 'Datos Generales', icon: Building },
                      { id: 'contactos', label: `Contactos (${currentCompany.contacts.length})`, icon: Users },
                      { id: 'centros', label: `Centros / Sucursales (${currentCompany.centers.length})`, icon: MapPin },
                      { id: 'facturacion', label: 'Facturación & Financiero', icon: CreditCard, locked: false },
                      { id: 'documentos', label: 'Documentos & Contratos', icon: FileText },
                      { id: 'actividad', label: 'Historial & Trazabilidad', icon: History }
                    ].map(tab => {
                      const Icon = tab.icon;
                      const isActive = activeTab === tab.id;
                      return (
                        <button
                          key={tab.id}
                          onClick={() => setActiveTab(tab.id)}
                          className={`flex items-center gap-2 px-4 py-2.5 text-xs font-semibold border-b-2 transition whitespace-nowrap ${
                            isActive
                              ? 'border-emerald-600 text-emerald-700 bg-emerald-50/40'
                              : 'border-transparent text-slate-500 hover:text-slate-800 hover:border-slate-300'
                          }`}
                        >
                          <Icon className={`w-3.5 h-3.5 ${isActive ? 'text-emerald-600' : 'text-slate-400'}`} />
                          {tab.label}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* CONTENIDO DE LA PESTAÑA SELECCIONADA */}
                <div className="flex-1 overflow-y-auto p-6">
                  
                  {/* TAB 1: RESUMEN FUNCIONAL */}
                  {activeTab === 'resumen' && (
                    <div className="max-w-5xl space-y-6">
                      
                      {/* ESTADOS FUNCIONALES DESCRIPTIVOS (Sin porcentajes vacíos) */}
                      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
                        <div className="flex items-center justify-between mb-4">
                          <div>
                            <h3 className="text-sm font-bold text-slate-900">Estado Operativo y Desbloqueo de Acciones</h3>
                            <p className="text-xs text-slate-500">Explicación clara de qué datos faltan y qué operativa habilitan.</p>
                          </div>
                          <span className="text-xs bg-emerald-100 text-emerald-800 font-medium px-2.5 py-1 rounded-md">
                            Flujo ETT Progresivo
                          </span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          
                          {/* ESTADO 1: ALTA BÁSICA */}
                          <div className="p-4 rounded-lg border border-emerald-200 bg-emerald-50/40 flex items-start gap-3">
                            <CheckCircle2 className="w-5 h-5 text-emerald-600 shrink-0 mt-0.5" />
                            <div className="space-y-1">
                              <div className="text-xs font-bold text-emerald-950">1. Alta Básica Completada</div>
                              <p className="text-xs text-slate-600">
                                Razón social, CIF (<strong className="font-mono">{currentCompany.cif}</strong>), país, teléfono de contacto y asesor comercial asignado.
                              </p>
                              <div className="text-[11px] text-emerald-700 font-medium">✓ Empresa registrada en el sistema</div>
                            </div>
                          </div>

                          {/* ESTADO 2: LISTA PARA PRESUPUESTAR */}
                          <div className="p-4 rounded-lg border border-emerald-200 bg-emerald-50/40 flex items-start gap-3">
                            <CheckCircle2 className="w-5 h-5 text-emerald-600 shrink-0 mt-0.5" />
                            <div className="space-y-1 flex-1">
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-bold text-emerald-950">2. Lista para Presupuestar</span>
                                <span className="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">HABILITADO</span>
                              </div>
                              <p className="text-xs text-slate-600">
                                Tiene contacto destinatario (<strong>{currentCompany.contacts[0]?.name || 'Marta Gómez'}</strong>) listo para recibir propuestas de tarifa/hora.
                              </p>
                              <div className="pt-1">
                                <button
                                  onClick={() => showToast(`Iniciando presupuesto para ${currentCompany.name}...`)}
                                  className="text-xs font-bold text-emerald-700 hover:text-emerald-900 flex items-center gap-1 underline"
                                >
                                  Crear Presupuesto Comercial ahora →
                                </button>
                              </div>
                            </div>
                          </div>

                          {/* ESTADO 3: PETICIÓN OPERATIVA (Falta centro) */}
                          <div className={`p-4 rounded-lg border ${
                            currentCompany.centers.length > 0 
                              ? 'border-emerald-200 bg-emerald-50/40' 
                              : 'border-amber-200 bg-amber-50/50'
                          } flex items-start gap-3`}>
                            {currentCompany.centers.length > 0 ? (
                              <CheckCircle2 className="w-5 h-5 text-emerald-600 shrink-0 mt-0.5" />
                            ) : (
                              <AlertTriangle className="w-5 h-5 text-amber-600 shrink-0 mt-0.5" />
                            )}
                            <div className="space-y-1.5 flex-1">
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-bold text-slate-900">3. Petición Operativa de Personal</span>
                                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${
                                  currentCompany.centers.length > 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                }`}>
                                  {currentCompany.centers.length > 0 ? 'DESBLOQUEADO' : 'PENDIENTE'}
                                </span>
                              </div>
                              <p className="text-xs text-slate-600">
                                {currentCompany.centers.length > 0 
                                  ? `Tiene ${currentCompany.centers.length} centro(s) configurado(s). Ya se pueden asignar trabajadores y turnos.`
                                  : 'Falta centro de trabajo para crear una petición operativa. No bloquea el presupuesto comercial.'}
                              </p>
                              {currentCompany.centers.length === 0 && (
                                <div className="flex items-center gap-2 pt-1">
                                  <button
                                    onClick={() => setDrawerState({ isOpen: true, type: 'new-center', data: null, hasUnsavedChanges: false })}
                                    className="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded text-xs font-medium transition"
                                  >
                                    Completar centro ahora
                                  </button>
                                  <span className="text-[11px] text-slate-400">o hacerlo más tarde al cerrar el contrato</span>
                                </div>
                              )}
                            </div>
                          </div>

                          {/* ESTADO 4: FACTURACIÓN */}
                          <div className={`p-4 rounded-lg border ${
                            currentCompany.billing.isComplete 
                              ? 'border-emerald-200 bg-emerald-50/40' 
                              : 'border-slate-200 bg-slate-50'
                          } flex items-start gap-3`}>
                            {currentCompany.billing.isComplete ? (
                              <CheckCircle2 className="w-5 h-5 text-emerald-600 shrink-0 mt-0.5" />
                            ) : (
                              <Clock className="w-5 h-5 text-slate-400 shrink-0 mt-0.5" />
                            )}
                            <div className="space-y-1.5 flex-1">
                              <div className="flex items-center justify-between">
