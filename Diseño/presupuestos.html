    // ==========================================
    // UTILIDADES DE CÁLCULO ECONÓMICO ETT
    // ==========================================
    function calcularEconomiaPosicion(pos, conceptos) {
      const horasAnuales = pos.horasAnuales > 0 ? pos.horasAnuales : 1784;
      const salarioBase = Number(pos.salarioBaseAnual) || 0;
      const plusMensual = Number(pos.plusConvenioMes) || 0;
      const pagas = Number(pos.pagasAnuales) || 12;
      const horasDia = Number(pos.horasDiaCalculo) || 8;
      const parcialidad = Number(pos.coeficienteParcialidad) || 1.0;
      const tarifaPVP = Number(pos.tarifaHoraOfertada) || 0;

      // Salario Bruto Anual Total = Salario Base + (Plus Mensual * 12 o Pagas)
      const plusAnual = plusMensual * 12;
      const salarioBrutoAnual = salarioBase + plusAnual;

      // Salario Bruto por Hora Efectiva
      const salarioBrutoHora = (salarioBrutoAnual / horasAnuales) * parcialidad;

      // Prorrata de Pagas Extras y Vacaciones integrada en hora efectiva
      const costeSalarialHora = salarioBrutoHora; 

      // Calcular conceptos de escandallo
      let totalCosteSocialHora = 0;
      let desgloseConceptos = [];

      conceptos.forEach(c => {
        let base = salarioBrutoHora;
        if (c.baseCalculo === 'coste_salarial_total' || c.baseCalculo === 'base_ss_total') {
          base = costeSalarialHora;
        } else if (c.baseCalculo === 'tarifa_venta_hora') {
          base = tarifaPVP;
        } else if (c.baseCalculo === 'horas_reales_efectivas') {
          base = 1.0; // Fijo por hora
        }

        let importeHora = 0;
        if (c.tipo === 'porcentaje') {
          importeHora = (base * Number(c.valor)) / 100;
        } else if (c.tipo === 'fijo_hora') {
          importeHora = Number(c.valor);
        } else if (c.tipo === 'fijo_jornada') {
          importeHora = Number(c.valor) / horasDia;
        } else if (c.tipo === 'fijo_mes') {
          importeHora = Number(c.valor) / (horasAnuales / 12);
        }

        totalCosteSocialHora += importeHora;
        desgloseConceptos.push({
          id: c.id,
          nombre: c.nombre,
          importeHora: importeHora,
          esLegal: c.esObligatorioLegal
        });
      });

      // Coste Total Empresa ETT por Hora
      const costeTotalEmpresaHora = salarioBrutoHora + totalCosteSocialHora;

      // Margen Bruto
      const margenEuroHora = tarifaPVP - costeTotalEmpresaHora;
      const margenPorcentaje = tarifaPVP > 0 ? (margenEuroHora / tarifaPVP) * 100 : 0;

      // Tarifa Jornada
      const tarifaJornadaCalculada = tarifaPVP * horasDia;
      const costeJornada = costeTotalEmpresaHora * horasDia;

      return {
        salarioBrutoHora,
        salarioBrutoAnual,
        costeTotalEmpresaHora,
        totalCosteSocialHora,
        margenEuroHora,
        margenPorcentaje,
        tarifaJornadaCalculada,
        costeJornada,
        desgloseConceptos,
        tarifaPVP,
        horasDia
      };
    }

      const [formularioPresupuesto, setFormularioPresupuesto] = useState(DEMO_PRESUPUESTO_INICIAL);
      const [cambiosPendientes, setCambiosPendientes] = useState([]);
      const [hayCambiosSinGuardar, setHayCambiosSinGuardar] = useState(false);
      const [estadoGuardado, setEstadoGuardado] = useState('guardado'); // 'guardado' | 'guardando' | 'incompleto' | 'revision' | 'error'
      
      // Paneles laterales (Drawers) y Modales
      const [drawerPosicionAbierto, setDrawerPosicionAbierto] = useState(false);
      const [posicionEnEdicion, setPosicionEnEdicion] = useState(null); // null = nuevo
      
      const [drawerConceptoAbierto, setDrawerConceptoAbierto] = useState(false);
      const [conceptoEnEdicion, setConceptoEnEdicion] = useState(null);

      const [modalResumenCambiosAbierto, setModalResumenCambiosAbierto] = useState(false);
      const [modalConfirmarEliminarPosicion, setModalConfirmarEliminarPosicion] = useState(null);
      const [modalConfirmarConvenio, setModalConfirmarConvenio] = useState(null);
      const [modalNuevaVersionAbierto, setModalNuevaVersionAbierto] = useState(false);

      // Toast feedback
      const [toast, setToast] = useState(null);

      const mostrarToast = (mensaje, tipo = 'exito') => {
        setToast({ mensaje, tipo });
        setTimeout(() => setToast(null), 4000);
      };

      // Control de autoguardado simulado cuando hay cambios
      useEffect(() => {
        if (modoEdicion && hayCambiosSinGuardar) {
          const timer = setTimeout(() => {
            // simular guardado en borrador en background
            setEstadoGuardado('borrador_auto');

        }
      }, [hayCambiosSinGuardar, modoEdicion, formularioPresupuesto]);

      // Comprobar si el presupuesto está completo para emitir
      const estaCompleto = useMemo(() => {
        const p = formularioPresupuesto;
        if (!p.titulo || !p.cliente || !p.comercial || !p.fechaValidez) return false;
        if (!p.posiciones || p.posiciones.length === 0) return false;
        return p.posiciones.every(pos => pos.tarifaHoraOfertada > 0 && pos.salarioBaseAnual > 0);
      }, [formularioPresupuesto]);

      // Iniciar edición
      const handleIniciarEdicion = () => {
        if (presupuesto.estado === 'Enviado a Cliente' || presupuesto.estado === 'Pendiente de Firma' || presupuesto.estado === 'Firmado / Aceptado') {
          // Si está cerrado o enviado, abrir flujo de nueva versión editable
          setModalNuevaVersionAbierto(true);
        } else {
          setFormularioPresupuesto(JSON.parse(JSON.stringify(presupuesto)));
          setModoEdicion(true);
          setHayCambiosSinGuardar(false);
          setEstadoGuardado('guardado');
          mostrarToast('Modo edición activado. Modifica datos, posiciones o conceptos.', 'info');
        }
      };

      // Crear nueva versión editable a partir de uno cerrado
      const handleCrearNuevaVersion = () => {
        const nuevoNum = presupuesto.versionNumero + 1;
        const nuevoId = `${presupuesto.id}-v${nuevoNum}`;
        const nuevaCopia = {
          ...presupuesto,
          codigoVersion: nuevoId,
          versionNumero: nuevoNum,
          estado: 'Borrador',
          esEditableDirecto: true,
          titulo: `${presupuesto.titulo} (v${nuevoNum})`,
          auditoria: [
            {
              id: `aud-${Date.now()}`,
              fecha: new Date().toISOString().replace('T', ' ').substring(0, 19),
              usuario: 'Elena Navarro (KAM)',
              accion: 'Creación de versión editable',
              detalle: `Generada nueva versión ${nuevoId} a partir de la versión sustituida.`
            },
            ...presupuesto.auditoria
          ]
        };
        setPresupuesto(nuevaCopia);
        setFormularioPresupuesto(JSON.parse(JSON.stringify(nuevaCopia)));
        setModoEdicion(true);
        setModalNuevaVersionAbierto(false);
        setHayCambiosSinGuardar(false);
        mostrarToast(`Nueva versión editable creada: ${nuevoId}`, 'exito');
      };

      // Cancelar edición
      const handleCancelarEdicion = () => {
        if (hayCambiosSinGuardar) {
          if (confirm('Tienes cambios sin guardar. ¿Deseas descartarlos y volver a la versión anterior?')) {
            setFormularioPresupuesto(JSON.parse(JSON.stringify(presupuesto)));
            setModoEdicion(false);
            setHayCambiosSinGuardar(false);
            mostrarToast('Edición cancelada.', 'info');
          }
        } else {
          setModoEdicion(false);
        }
      };

      // Detectar diferencias para el Diff Modal
      const calcularDiferencias = () => {
        const diffs = [];
        const orig = presupuesto;
        const edit = formularioPresupuesto;

        if (orig.titulo !== edit.titulo) diffs.push({ campo: 'Título del servicio', anterior: orig.titulo, nuevo: edit.titulo });
        if (orig.cliente !== edit.cliente) diffs.push({ campo: 'Empresa Cliente', anterior: orig.cliente, nuevo: edit.cliente });
        if (orig.contacto !== edit.contacto) diffs.push({ campo: 'Contacto destinatario', anterior: orig.contacto, nuevo: edit.contacto });
        if (orig.comercial !== edit.comercial) diffs.push({ campo: 'Responsable Comercial', anterior: orig.comercial, nuevo: edit.comercial });
        if (orig.fechaValidez !== edit.fechaValidez) diffs.push({ campo: 'Fecha de Validez', anterior: orig.fechaValidez, nuevo: edit.fechaValidez });
        if (orig.modalidad !== edit.modalidad) diffs.push({ campo: 'Modalidad ETT', anterior: orig.modalidad, nuevo: edit.modalidad });
        if (orig.formaPago !== edit.formaPago) diffs.push({ campo: 'Forma de Pago', anterior: orig.formaPago, nuevo: edit.formaPago });
        if (orig.garantiaSustitucion !== edit.garantiaSustitucion) diffs.push({ campo: 'Garantía sustitución', anterior: orig.garantiaSustitucion, nuevo: edit.garantiaSustitucion });

        // Diferencias en posiciones
        if (orig.posiciones.length !== edit.posiciones.length) {
          diffs.push({
            campo: 'Número de puestos',
            anterior: `${orig.posiciones.length} puesto(s)`,
            nuevo: `${edit.posiciones.length} puesto(s)`
          });
        }

        edit.posiciones.forEach((pos, idx) => {
          const posOrig = orig.posiciones.find(p => p.id === pos.id);
          if (!posOrig) {
            diffs.push({ campo: `Nuevo puesto añadido`, anterior: '—', nuevo: `${pos.nombre} (${pos.tarifaHoraOfertada} €/h)` });
          } else {
            if (posOrig.tarifaHoraOfertada !== pos.tarifaHoraOfertada) {
              diffs.push({ campo: `Tarifa [${pos.nombre}]`, anterior: `${posOrig.tarifaHoraOfertada} €/h`, nuevo: `${pos.tarifaHoraOfertada} €/h` });
            }
            if (posOrig.salarioBaseAnual !== pos.salarioBaseAnual) {
              diffs.push({ campo: `Salario Base [${pos.nombre}]`, anterior: `${posOrig.salarioBaseAnual} €`, nuevo: `${pos.salarioBaseAnual} €` });
            }
            if (posOrig.convenio !== pos.convenio) {
              diffs.push({ campo: `Convenio [${pos.nombre}]`, anterior: posOrig.convenio, nuevo: pos.convenio });
            }
          }
        });

        // Diferencias en conceptos
        if (orig.conceptosEscandallo.length !== edit.conceptosEscandallo.length) {
          diffs.push({
            campo: 'Conceptos del escandallo',
            anterior: `${orig.conceptosEscandallo.length} conceptos`,
            nuevo: `${edit.conceptosEscandallo.length} conceptos`
          });
        }

        return diffs;
      };

      // Solicitar guardar cambios (abre diff modal)
      const handleSolicitarGuardar = () => {
        const diffs = calcularDiferencias();
        setCambiosPendientes(diffs);
        setModalResumenCambiosAbierto(true);
      };

      // Confirmar y aplicar guardado definitivo
      const handleConfirmarGuardar = (guardarComoBorrador = false) => {
        setEstadoGuardado('guardando');
        
        setTimeout(() => {
          const nuevosLogs = cambiosPendientes.map(diff => ({
            id: `aud-${Date.now()}-${Math.random().toString(36).substr(2, 4)}`,
            fecha: new Date().toISOString().replace('T', ' ').substring(0, 19),
            usuario: rolUsuario === 'direccion' ? 'Dirección de Operaciones' : 'Elena Navarro (KAM)',
            accion: 'Modificación de presupuesto',
            detalle: `${diff.campo}: de "${diff.anterior}" a "${diff.nuevo}"`
          }));

          const updated = {
            ...formularioPresupuesto,
            estado: guardarComoBorrador ? 'Borrador' : (estaCompleto ? 'En preparación' : 'Borrador'),
            auditoria: [
              ...(nuevosLogs.length > 0 ? nuevosLogs : [{
                id: `aud-${Date.now()}`,
                fecha: new Date().toISOString().replace('T', ' ').substring(0, 19),
                usuario: 'Elena Navarro (KAM)',
                accion: 'Guardado de presupuesto',
                detalle: 'Revisión y actualización de datos.'
              }]),
              ...formularioPresupuesto.auditoria
            ]
          };

          setPresupuesto(updated);
          setFormularioPresupuesto(updated);
          setModoEdicion(false);
          setHayCambiosSinGuardar(false);
          setEstadoGuardado('guardado');
          setModalResumenCambiosAbierto(false);
          mostrarToast('Presupuesto guardado correctamente y registrado en auditoría.', 'exito');
        }, 600);
      };

      // Guardar directamente como borrador (permite datos incompletos)
      const handleGuardarComoBorradorDirecto = () => {
        const updated = {
          ...formularioPresupuesto,
          estado: 'Borrador',
          auditoria: [
            {
              id: `aud-${Date.now()}`,
              fecha: new Date().toISOString().replace('T', ' ').substring(0, 19),
              usuario: 'Elena Navarro (KAM)',
              accion: 'Guardado en Borrador',
              detalle: 'Guardado manual en estado borrador (puede contener datos provisionales).'
            },
            ...formularioPresupuesto.auditoria
          ]
        };
        setPresupuesto(updated);
        setFormularioPresupuesto(updated);
        setModoEdicion(false);
        setHayCambiosSinGuardar(false);
        mostrarToast('Presupuesto guardado como Borrador.', 'info');
      };

      // Actualizar campos del presupuesto en formulario
      const handleActualizarCampoPresupuesto = (campo, valor) => {
        setFormularioPresupuesto(prev => ({
          ...prev,
          [campo]: valor
        }));
        setHayCambiosSinGuardar(true);
      };

      // ==========================================
      // GESTIÓN DE POSICIONES
      // ==========================================
      const handleAbrirDrawerPosicion = (pos = null) => {
        if (!modoEdicion) {
          setFormularioPresupuesto(JSON.parse(JSON.stringify(presupuesto)));
          setModoEdicion(true);
        }
        if (pos) {
          setPosicionEnEdicion(JSON.parse(JSON.stringify(pos)));
        } else {
          // Nueva posición default
          setPosicionEnEdicion({
            id: `pos-${Date.now()}`,
            nombre: '',
            convenio: 'logistica_madrid',
            convenioCustom: '',
            categoria: 'op_almacen',
            categoriaCustom: '',
            grupoNivel: 'g4',
            grupoNivelCustom: '',
            salarioBaseAnual: 18000,
            plusConvenioMes: 100,
            pagasAnuales: 14,
            horasAnuales: 1784,
            horasDiaCalculo: 8,
            coeficienteParcialidad: 1.0,
            tarifaHoraOfertada: 18.50,
            tarifaJornadaManual: null,
            vacacionesDiasAnio: 30,
            descripcionTareas: ''
          });
        }
        setDrawerPosicionAbierto(true);
      };

      const handleGuardarPosicion = (posData) => {
        if (!posData.nombre || !posData.tarifaHoraOfertada) {
          alert('Por favor indica al menos el nombre del puesto y la tarifa ofertada.');
          return;
        }

        const existe = formularioPresupuesto.posiciones.some(p => p.id === posData.id);
        let nuevasPosiciones;
        if (existe) {
          nuevasPosiciones = formularioPresupuesto.posiciones.map(p => p.id === posData.id ? posData : p);
        } else {
          nuevasPosiciones = [...formularioPresupuesto.posiciones, posData];
        }

        setFormularioPresupuesto(prev => ({
          ...prev,
          posiciones: nuevasPosiciones
        }));
        setHayCambiosSinGuardar(true);
        setDrawerPosicionAbierto(false);
        setPosicionEnEdicion(null);
        mostrarToast(existe ? 'Puesto actualizado.' : 'Nuevo puesto añadido al presupuesto.', 'exito');
      };

      const handleDuplicarPosicion = (pos) => {
        if (!modoEdicion) {
          setFormularioPresupuesto(JSON.parse(JSON.stringify(presupuesto)));
          setModoEdicion(true);
        }
        const copia = {
          ...pos,
          id: `pos-${Date.now()}`,
          nombre: `${pos.nombre} (Copia)`
        };
        setFormularioPresupuesto(prev => ({
          ...prev,
          posiciones: [...prev.posiciones, copia]
        }));
        setHayCambiosSinGuardar(true);
        mostrarToast(`Puesto "${pos.nombre}" duplicado con éxito.`, 'exito');
      };

      const handleEliminarPosicion = (posId) => {
        if (formularioPresupuesto.posiciones.length <= 1) {
          alert('No es posible eliminar la única posición del presupuesto. Debe existir al menos un puesto cotizado.');
          return;
        }
        setModalConfirmarEliminarPosicion(posId);
      };

      const confirmarEliminacionPosicion = () => {
        const nuevasPos = formularioPresupuesto.posiciones.filter(p => p.id !== modalConfirmarEliminarPosicion);
        setFormularioPresupuesto(prev => ({
          ...prev,
          posiciones: nuevasPos
        }));
        setHayCambiosSinGuardar(true);
        setModalConfirmarEliminarPosicion(null);
        mostrarToast('Posición eliminada del presupuesto.', 'info');
      };

      // ==========================================
      // GESTIÓN DE CONCEPTOS DE ESCANDALLO
      // ==========================================
      const handleAbrirDrawerConcepto = (concepto = null) => {
        if (!modoEdicion) {
          setFormularioPresupuesto(JSON.parse(JSON.stringify(presupuesto)));
          setModoEdicion(true);
        }
        if (concepto) {
          setConceptoEnEdicion(JSON.parse(JSON.stringify(concepto)));
        } else {
          setConceptoEnEdicion({
            id: `c-${Date.now()}`,
            nombre: '',
            tipo: 'porcentaje',
            tipoCustom: '',
            valor: 1.5,
            baseCalculo: 'salario_bruto_hora',
            baseCalculoCustom: '',
            esObligatorioLegal: false,
            descripcion: ''
          });
        }
        setDrawerConceptoAbierto(true);
      };

      const handleGuardarConcepto = (conceptoData) => {
        if (!conceptoData.nombre || conceptoData.valor === '' || isNaN(Number(conceptoData.valor))) {
          alert('Por favor ingresa un nombre y un valor numérico válido para el concepto.');
          return;
        }
        const existe = formularioPresupuesto.conceptosEscandallo.some(c => c.id === conceptoData.id);
        let nuevosConceptos;
        if (existe) {
          nuevosConceptos = formularioPresupuesto.conceptosEscandallo.map(c => c.id === conceptoData.id ? conceptoData : c);
        } else {
          nuevosConceptos = [...formularioPresupuesto.conceptosEscandallo, conceptoData];
        }

        setFormularioPresupuesto(prev => ({
          ...prev,
          conceptosEscandallo: nuevosConceptos
        }));
        setHayCambiosSinGuardar(true);
        setDrawerConceptoAbierto(false);
        setConceptoEnEdicion(null);
        mostrarToast(existe ? 'Concepto económico actualizado.' : 'Nuevo concepto añadido al escandallo.', 'exito');
      };

      const handleEliminarConcepto = (conceptoId) => {
        const concepto = formularioPresupuesto.conceptosEscandallo.find(c => c.id === conceptoId);
        if (concepto && concepto.esObligatorioLegal) {
          alert('Este concepto es de cumplimiento legal obligatorio para ETT (Seguridad Social o Indemnización legal) y no puede eliminarse.');
          return;
        }
        if (confirm(`¿Deseas eliminar el concepto "${concepto?.nombre}"?`)) {
          const nuevos = formularioPresupuesto.conceptosEscandallo.filter(c => c.id !== conceptoId);
          setFormularioPresupuesto(prev => ({
            ...prev,
            conceptosEscandallo: nuevos
          }));
          setHayCambiosSinGuardar(true);
          mostrarToast('Concepto eliminado del escandallo.', 'info');
        }
      };

      // Cálculos globales agregados
      const datosActivos = modoEdicion ? formularioPresupuesto : presupuesto;
      const calculosPosiciones = useMemo(() => {
        return datosActivos.posiciones.map(pos => ({
          pos,
          eco: calcularEconomiaPosicion(pos, datosActivos.conceptosEscandallo)
        }));
      }, [datosActivos]);

      const totalesAgregados = useMemo(() => {
        if (calculosPosiciones.length === 0) return { tarifaMedia: 0, costeMedio: 0, margenMedioPct: 0, margenMedioEur: 0 };
        const sumaTarifas = calculosPosiciones.reduce((acc, item) => acc + item.eco.tarifaPVP, 0);
        const sumaCostes = calculosPosiciones.reduce((acc, item) => acc + item.eco.costeTotalEmpresaHora, 0);
        const mediaTarifa = sumaTarifas / calculosPosiciones.length;
        const mediaCoste = sumaCostes / calculosPosiciones.length;
        const margenEur = mediaTarifa - mediaCoste;
        const margenPct = mediaTarifa > 0 ? (margenEur / mediaTarifa) * 100 : 0;
        return {
          tarifaMedia: mediaTarifa,
          costeMedio: mediaCoste,
          margenMedioEur: margenEur,
          margenMedioPct: margenPct
        };
      }, [calculosPosiciones]);

      // Render de etiqueta de estado
      const renderBadgeEstado = (estado) => {
        const estilos = {
          'Borrador': 'bg-amber-50 text-amber-700 border-amber-200',
          'En preparación': 'bg-sky-50 text-sky-700 border-sky-200',
          'Enviado a Cliente': 'bg-indigo-50 text-indigo-700 border-indigo-200',
          'Pendiente de Firma': 'bg-purple-50 text-purple-700 border-purple-200',
          'Firmado / Aceptado': 'bg-emerald-50 text-emerald-700 border-emerald-200',
          'Rechazado': 'bg-rose-50 text-rose-700 border-rose-200',
          'Sustituido': 'bg-slate-100 text-slate-600 border-slate-300'
        };
        return (
          <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${estilos[estado] || 'bg-slate-100 text-slate-700 border-slate-300'}`}>
            <span className="w-1.5 h-1.5 rounded-full bg-current"></span>
            {estado}
          </span>
        );
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-100/70">
          
          {/* ==========================================
              CABECERA SUPERIOR (Fiel a v2 ERP)
             ========================================== */}
          <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Logo / Módulo */}
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-inner">
                  <Calculator className="w-5 h-5 text-white" />
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-bold text-slate-100 tracking-tight text-base">ERP ETT</span>
                    <span className="text-xs px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-medium">v3 Cotización</span>
                  </div>
                  <h1 className="text-xs text-slate-400 font-normal">Presupuestos y Cotización — Editor de presupuestos</h1>
                </div>
              </div>

              {/* Centro: Selector de Rol y Estado de Guardado */}
              <div className="hidden md:flex items-center gap-4">
                
                {/* Indicador de cambios sin guardar / autoguardado */}
                {modoEdicion && (
                  <div className="flex items-center gap-2 px-3 py-1 rounded-md bg-slate-800/90 border border-slate-700 text-xs">
                    {hayCambiosSinGuardar ? (
                      <span className="flex items-center gap-1.5 text-amber-400 font-medium animate-pulse-subtle">
                        <AlertCircle className="w-3.5 h-3.5" />
                        Cambios sin guardar
                      </span>
                    ) : (
                      <span className="flex items-center gap-1.5 text-emerald-400">
                        <Check className="w-3.5 h-3.5" />
                        Cambios guardados
                      </span>
                    )}
                    <span className="text-slate-500">|</span>
                    <span className="text-slate-400 text-[11px]">
                      {estaCompleto ? 'Listo para emitir' : 'Borrador incompleto'}
                    </span>
                  </div>
                )}

                {/* Switcher de Rol (Dirección vs Comercial) */}
                <div className="flex items-center bg-slate-800 p-0.5 rounded-lg border border-slate-700 text-xs">
                  <button
                    onClick={() => setRolUsuario('direccion')}
                    className={`px-3 py-1.5 rounded-md font-medium transition-colors flex items-center gap-1.5 ${
                      rolUsuario === 'direccion' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                    }`}
                    title="Visión completa: muestra costes, escandallo social y márgenes netos"
                  >
                    <ShieldCheck className="w-3.5 h-3.5" />
                    Rol Dirección
                  </button>
                  <button
                    onClick={() => setRolUsuario('comercial')}
                    className={`px-3 py-1.5 rounded-md font-medium transition-colors flex items-center gap-1.5 ${
                      rolUsuario === 'comercial' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'
                    }`}
                    title="Visión comercial: datos sensibles de costes ocultos o restringidos"
                  >
                    <Briefcase className="w-3.5 h-3.5" />
                    Rol Comercial
                  </button>
                </div>
              </div>

              {/* Botones de acción rápida en cabecera */}
              <div className="flex items-center gap-2.5">
                {vistaActual === 'detalle' && (
                  <>
                    <button
                      onClick={() => setVistaActual('listado')}
                      className="px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 flex items-center gap-1.5 transition-colors"
                    >
                      <ArrowLeft className="w-3.5 h-3.5" />
                      Listado
                    </button>

                    {modoEdicion ? (
                      <div className="flex items-center gap-2">
                        <button
                          onClick={handleCancelarEdicion}
                          className="px-3 py-1.5 text-xs text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 transition-colors"
                        >
                          Cancelar
                        </button>
                        <button
                          onClick={handleGuardarComoBorradorDirecto}
                          className="hidden sm:inline-flex px-3 py-1.5 text-xs text-amber-200 bg-amber-950/40 hover:bg-amber-900/60 border border-amber-800/60 rounded-lg transition-colors font-medium items-center gap-1"
                        >
                          <Save className="w-3.5 h-3.5" />
                          Guardar borrador
                        </button>
                        <button
                          onClick={handleSolicitarGuardar}
                          className="px-3.5 py-1.5 text-xs text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold shadow flex items-center gap-1.5 transition-all"
                        >
                          <Save className="w-3.5 h-3.5" />
                          Guardar cambios
                        </button>
                      </div>
                    ) : (
                      <div className="flex items-center gap-2">
                        {presupuesto.esEditableDirecto ? (
                          <button
                            onClick={handleIniciarEdicion}
                            className="px-3.5 py-1.5 text-xs text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold shadow flex items-center gap-1.5 transition-all"
                          >
                            <Edit3 className="w-3.5 h-3.5" />
                            Editar presupuesto
                          </button>
                        ) : (
                          <button
                            onClick={() => setModalNuevaVersionAbierto(true)}
                            className="px-3.5 py-1.5 text-xs text-white bg-purple-600 hover:bg-purple-500 rounded-lg font-semibold shadow flex items-center gap-1.5 transition-all"
                          >
                            <GitBranch className="w-3.5 h-3.5" />
                            Crear nueva versión editable
                          </button>
                        )}
                      </div>
                    )}
                  </>
                )}

                {vistaActual === 'listado' && (
                  <button
                    onClick={() => {
                      setVistaActual('detalle');
                      handleIniciarEdicion();
                    }}
                    className="px-3.5 py-1.5 text-xs text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg font-semibold shadow flex items-center gap-1.5"
                  >
                    <Plus className="w-3.5 h-3.5" />
                    Nuevo presupuesto
                  </button>
                )}
              </div>

            </div>
          </header>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 animate-bounce shadow-2xl">
              <div className={`px-4 py-3 rounded-lg text-sm font-medium flex items-center gap-2.5 shadow-lg border ${
                toast.tipo === 'exito' ? 'bg-emerald-900 text-emerald-100 border-emerald-700' :
                toast.tipo === 'error' ? 'bg-rose-900 text-rose-100 border-rose-700' :
                'bg-slate-900 text-slate-100 border-slate-700'
              }`}>
                {toast.tipo === 'exito' && <CheckCircle2 className="w-4 h-4 text-emerald-400" />}
                {toast.tipo === 'error' && <AlertTriangle className="w-4 h-4 text-rose-400" />}
                {toast.tipo === 'info' && <Info className="w-4 h-4 text-sky-400" />}
                <span>{toast.mensaje}</span>
                <button onClick={() => setToast(null)} className="ml-2 text-slate-400 hover:text-white">
                  <X className="w-3.5 h-3.5" />
                </button>
              </div>
            </div>
          )}

          {/* ==========================================
              VISTA PRINCIPAL: LISTADO DE PRESUPUESTOS
             ========================================== */}
          {vistaActual === 'listado' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
              <div className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h2 className="text-xl font-bold text-slate-900">Listado de Presupuestos & Cotizaciones ETT</h2>
                  <p className="text-xs text-slate-500 mt-0.5">Control de propuestas comerciales, tarifas por puesto y márgenes de contribución.</p>
                </div>
                <div className="flex items-center gap-2">
                  <div className="relative">
                    <Search className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" />
                    <input
                      type="text"
                      placeholder="Buscar por cliente o código..."
                      className="pl-9 pr-3 py-1.5 text-xs bg-white border border-slate-300 rounded-lg text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64"
                    />
                  </div>
                </div>
              </div>

              {/* Tabla de listado con badges de editable */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table className="min-w-full divide-y divide-slate-200 text-left text-xs">
                  <thead className="bg-slate-50 font-semibold text-slate-700 uppercase tracking-wider">
                    <tr>
                      <th className="px-5 py-3">Código & Versión</th>
                      <th className="px-5 py-3">Empresa Cliente / Título</th>
                      <th className="px-5 py-3">Puestos</th>
                      <th className="px-5 py-3">Tarifa Media</th>
                      {rolUsuario === 'direccion' && <th className="px-5 py-3">Margen %</th>}
                      <th className="px-5 py-3">Validez</th>
                      <th className="px-5 py-3">Estado</th>
                      <th className="px-5 py-3 text-right">Acción</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200 bg-white">
                    {DEMO_LISTADO_PRESUPUESTOS.map(p => (
                      <tr key={p.id} className="hover:bg-slate-50/80 transition-colors">
                        <td className="px-5 py-3.5 whitespace-nowrap font-medium text-indigo-600">
                          {p.id}
                        </td>
                        <td className="px-5 py-3.5">
                          <div className="font-semibold text-slate-900">{p.cliente}</div>
                          <div className="text-[11px] text-slate-500 line-clamp-1">{p.titulo}</div>
                        </td>
                        <td className="px-5 py-3.5 whitespace-nowrap text-slate-600">
                          <span className="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-medium">{p.puestosCount} perfil(es)</span>
                        </td>
                        <td className="px-5 py-3.5 whitespace-nowrap font-semibold text-slate-800">
                          {p.tarifaMedia.toFixed(2)} €/h
                        </td>
                        {rolUsuario === 'direccion' && (
                          <td className="px-5 py-3.5 whitespace-nowrap font-semibold text-emerald-600">
                            {p.margenPct.toFixed(1)} %
                          </td>
                        )}
                        <td className="px-5 py-3.5 whitespace-nowrap text-slate-500">
                          {p.fechaValidez}
                        </td>
                        <td className="px-5 py-3.5 whitespace-nowrap">
                          {renderBadgeEstado(p.estado)}
                        </td>
                        <td className="px-5 py-3.5 whitespace-nowrap text-right">
                          <div className="flex items-center justify-end gap-2">
                            {p.esEditableDirecto ? (
                              <button
                                onClick={() => {
                                  setVistaActual('detalle');
                                  handleIniciarEdicion();
                                }}
                                className="px-2.5 py-1 text-[11px] font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-md transition-colors flex items-center gap-1"
                              >
                                <Edit3 className="w-3 h-3" />
                                Abrir y editar
                              </button>
                            ) : (
                              <button
                                onClick={() => setVistaActual('detalle')}
                                className="px-2.5 py-1 text-[11px] font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 border border-slate-300 rounded-md transition-colors flex items-center gap-1"
                              >
                                <Eye className="w-3 h-3" />
                                Ver detalle
                              </button>
                            )}
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </main>
          )}

          {/* ==========================================
              VISTA PRINCIPAL: DETALLE DEL PRESUPUESTO
             ========================================== */}
          {vistaActual === 'detalle' && (
            <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full flex flex-col gap-5">

              {/* BARRA SUPERIOR DE INFORMACIÓN DE DETALLE */}
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                  
                  {/* Identificación y Título */}
                  <div className="space-y-1.5 flex-1">
                    <div className="flex flex-wrap items-center gap-2 text-xs">
                      <span className="font-mono font-bold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">
                        {datosActivos.codigoVersion}
                      </span>
                      {renderBadgeEstado(datosActivos.estado)}
                      
                      {modoEdicion && (
                        <span className="bg-amber-100 text-amber-800 px-2 py-0.5 rounded text-[11px] font-semibold border border-amber-200 flex items-center gap-1">
                          <Edit3 className="w-3 h-3" /> Modo Edición Activo
                        </span>
                      )}

                      {!datosActivos.esEditableDirecto && (
                        <span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[11px] font-medium border border-slate-200 flex items-center gap-1">
                          <Lock className="w-3 h-3" /> Versión Bloqueada (Requiere nueva versión)
                        </span>
                      )}
                    </div>

                    {modoEdicion ? (
                      <div className="pt-1">
                        <label className="text-[11px] font-medium text-slate-500 uppercase tracking-wider block mb-1">Título del presupuesto</label>
                        <input
                          type="text"
                          value={formularioPresupuesto.titulo}
                          onChange={(e) => handleActualizarCampoPresupuesto('titulo', e.target.value)}
                          className="w-full text-base font-bold text-slate-900 border border-slate-300 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 bg-amber-50/30"
                          placeholder="Nombre del servicio o campaña..."
                        />
                      </div>
                    ) : (
                      <h2 className="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">
                        {presupuesto.titulo}
                      </h2>
                    )}

                    <div className="flex flex-wrap items-center gap-y-1 gap-x-4 text-xs text-slate-600 pt-0.5">
                      <span className="flex items-center gap-1 font-medium text-slate-800">
                        <Building2 className="w-3.5 h-3.5 text-slate-400" />
                        {datosActivos.cliente}
                      </span>
                      <span className="text-slate-300">•</span>
                      <span className="flex items-center gap-1">
                        <User className="w-3.5 h-3.5 text-slate-400" />
                        {datosActivos.contacto}
                      </span>
                      <span className="text-slate-300">•</span>
                      <span className="flex items-center gap-1 text-slate-500">
                        <Calendar className="w-3.5 h-3.5 text-slate-400" />
                        Validez: {datosActivos.fechaValidez}
                      </span>
                    </div>
                  </div>

                  {/* Tarjetas resumen KPI de cabecera */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-3 rounded-lg border border-slate-200/80">
                    <div>
                      <div className="text-[11px] text-slate-500 font-medium">Tarifa Media</div>
                      <div className="text-base font-bold text-slate-900">{totalesAgregados.tarifaMedia.toFixed(2)} €/h</div>
                      <div className="text-[10px] text-slate-400">{datosActivos.posiciones.length} puesto(s)</div>
                    </div>

                    {rolUsuario === 'direccion' ? (
                      <>
                        <div>
                          <div className="text-[11px] text-slate-500 font-medium">Coste ETT Medio</div>
                          <div className="text-base font-bold text-slate-700">{totalesAgregados.costeMedio.toFixed(2)} €/h</div>
                          <div className="text-[10px] text-slate-400">Salario + SSSS + Otros</div>
                        </div>
                        <div>
                          <div className="text-[11px] text-slate-500 font-medium">Margen Bruto/h</div>
                          <div className="text-base font-bold text-emerald-600">+{totalesAgregados.margenMedioEur.toFixed(2)} €/h</div>
                          <div className="text-[10px] text-emerald-600 font-semibold">{totalesAgregados.margenMedioPct.toFixed(1)}% margen</div>
                        </div>
                      </>
                    ) : (
                      <div className="col-span-2 flex items-center justify-center bg-slate-100 rounded border border-dashed border-slate-300 p-2 text-center">
                        <span className="text-[11px] text-slate-500 flex items-center gap-1">
                          <Lock className="w-3 h-3" /> Costes protegidos (Rol Comercial)
                        </span>
                      </div>
                    )}

                    <div className="flex flex-col justify-center">
                      <div className="text-[11px] text-slate-500 font-medium">Puente Operativo</div>
                      {datosActivos.estado === 'Firmado / Aceptado' ? (
                        <button
                          onClick={() => alert('Redirigiendo a pantalla de Peticiones Operativas con datos de presupuesto importados...')}
                          className="mt-1 px-2.5 py-1 text-[11px] font-semibold text-white bg-emerald-600 hover:bg-emerald-500 rounded flex items-center justify-center gap-1 shadow-sm transition-colors"
                        >
                          <CheckCircle2 className="w-3 h-3" /> Crear Petición
                        </button>
                      ) : (
                        <span className="text-[11px] text-slate-400 italic">Requiere firma</span>
                      )}
                    </div>
                  </div>

                </div>
              </div>

              {/* NAVEGACIÓN POR PESTAÑAS (Fiel a v2 ERP) */}
              <div className="border-b border-slate-200 bg-white rounded-t-xl px-4 pt-2 flex flex-wrap gap-1 shadow-xs">
                {[
                  { id: 'resumen', label: 'Resumen Comercial', icon: FileText },
                  { id: 'posiciones', label: `Posiciones Cotizadas (${datosActivos.posiciones.length})`, icon: Briefcase },
                  { id: 'escandallo', label: 'Escandallo Económico & Costes', icon: Calculator, badge: rolUsuario === 'direccion' ? 'Dirección' : null },
                  { id: 'condiciones', label: 'Condiciones Comerciales', icon: ShieldCheck },
                  { id: 'historial', label: 'Historial de Versiones', icon: History },
                  { id: 'documentos', label: 'Documentos & PDF', icon: Download },
                  { id: 'auditoria', label: 'Auditoría & Actividad', icon: GitBranch }
                ].map(tab => {
                  const Icon = tab.icon;
                  const activo = pestanaActiva === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setPestanaActiva(tab.id)}
                      className={`flex items-center gap-2 px-3.5 py-2.5 text-xs font-semibold border-b-2 transition-all cursor-pointer ${
                        activo
                          ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50 rounded-t-lg'
                          : 'border-transparent text-slate-600 hover:text-slate-900 hover:border-slate-300'
                      }`}
                    >
                      <Icon className={`w-4 h-4 ${activo ? 'text-indigo-600' : 'text-slate-400'}`} />
                      <span>{tab.label}</span>
                      {tab.badge && (
                        <span className="text-[10px] bg-indigo-100 text-indigo-700 px-1.5 py-0.2 rounded font-normal">
                          {tab.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* CONTENIDO DE LAS PESTAÑAS */}
              <div className="bg-white rounded-b-xl shadow-sm border border-slate-200 p-6">
                
                {/* ----------------------------------------------------
                    PESTAÑA 1: RESUMEN COMERCIAL
                   ---------------------------------------------------- */}
                {pestanaActiva === 'resumen' && (
                  <div className="space-y-6">
                    <div className="flex flex-col md:flex-row md:items-center justify-between pb-4 border-b border-slate-200 gap-3">
                      <div>
                        <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Datos Generales & Empresa Cliente</h3>
                        <p className="text-xs text-slate-500">Parámetros principales de la oferta comercial y personas de contacto.</p>
                      </div>
                      {!modoEdicion && presupuesto.esEditableDirecto && (
                        <button
                          onClick={handleIniciarEdicion}
                          className="px-3 py-1.5 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg border border-indigo-200 flex items-center gap-1.5 self-start"
                        >
                          <Edit3 className="w-3.5 h-3.5" /> Editar Datos
                        </button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                      
                      {/* Tarjeta Cliente */}
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <div className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                          <Building2 className="w-4 h-4 text-indigo-600" /> Datos de la Empresa
                        </div>

                        {modoEdicion ? (
                          <div className="space-y-2.5">
                            <div>
                              <label className="text-[11px] font-medium text-slate-500 block">Razón Social Cliente</label>
                              <input
                                type="text"
                                value={formularioPresupuesto.cliente}
                                onChange={(e) => handleActualizarCampoPresupuesto('cliente', e.target.value)}
                                className="w-full text-xs bg-white border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>
                            <div>
                              <label className="text-[11px] font-medium text-slate-500 block">CIF / NIF</label>
                              <input
                                type="text"
                                value={formularioPresupuesto.cif}
                                onChange={(e) => handleActualizarCampoPresupuesto('cif', e.target.value)}
                                className="w-full text-xs bg-white border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>
                          </div>
                        ) : (
                          <div className="text-xs space-y-1.5">
                            <div><span className="text-slate-400">Cliente:</span> <span className="font-semibold text-slate-800">{presupuesto.cliente}</span></div>
                            <div><span className="text-slate-400">CIF:</span> <span className="font-mono text-slate-700">{presupuesto.cif}</span></div>
                            <div><span className="text-slate-400">Sector:</span> <span className="text-slate-700">Logística & Distribución</span></div>
                          </div>
                        )}
                      </div>

                      {/* Tarjeta Contacto */}
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <div className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                          <User className="w-4 h-4 text-indigo-600" /> Contacto & Interlocutor
                        </div>

                        {modoEdicion ? (
                          <div className="space-y-2.5">
                            <div>
                              <label className="text-[11px] font-medium text-slate-500 block">Persona de Contacto</label>
                              <input
                                type="text"
                                value={formularioPresupuesto.contacto}
                                onChange={(e) => handleActualizarCampoPresupuesto('contacto', e.target.value)}
                                className="w-full text-xs bg-white border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>
                            <div>
                              <label className="text-[11px] font-medium text-slate-500 block">Email</label>
                              <input
                                type="email"
                                value={formularioPresupuesto.emailContacto}
                                onChange={(e) => handleActualizarCampoPresupuesto('emailContacto', e.target.value)}
                                className="w-full text-xs bg-white border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>
                          </div>
                        ) : (
                          <div className="text-xs space-y-1.5">
                            <div><span className="text-slate-400">Contacto:</span> <span className="font-semibold text-slate-800">{presupuesto.contacto}</span></div>
                            <div><span className="text-slate-400">Email:</span> <span className="text-indigo-600">{presupuesto.emailContacto}</span></div>
                            <div><span className="text-slate-400">Teléfono:</span> <span className="text-slate-700">{presupuesto.telefonoContacto}</span></div>
                          </div>
                        )}
                      </div>

                      {/* Tarjeta Gestión Comercial */}
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <div className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                          <Briefcase className="w-4 h-4 text-indigo-600" /> Gestión Comercial ETT
                        </div>

                        {modoEdicion ? (
                          <div className="space-y-2.5">
                            <div>
                              <label className="text-[11px] font-medium text-slate-500 block">Responsable Comercial</label>
                              <input
                                type="text"
                                value={formularioPresupuesto.comercial}
                                onChange={(e) => handleActualizarCampoPresupuesto('comercial', e.target.value)}
                                className="w-full text-xs bg-white border border-slate-300 rounded-md px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500"
                              />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                              <div>
                                <label className="text-[11px] font-medium text-slate-500 block">Emisión</label>
                                <input
                                  type="date"
                                  value={formularioPresupuesto.fechaEmision}
                                  onChange={(e) => handleActualizarCampoPresupuesto('fechaEmision', e.target.value)}
                                  className="w-full text-xs bg-white border border-slate-300 rounded-md px-2 py-1.5"
                                />
                              </div>
                              <div>
                                <label className="text-[11px] font-medium text-slate-500 block">Validez</label>
                                <input
                                  type="date"
                                  value={formularioPresupuesto.fechaValidez}
                                  onChange={(e) => handleActualizarCampoPresupuesto('fechaValidez', e.target.value)}
                                  className="w-full text-xs bg-white border border-slate-300 rounded-md px-2 py-1.5"
                                />
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="text-xs space-y-1.5">
                            <div><span className="text-slate-400">KAM Responsable:</span> <span className="font-semibold text-slate-800">{presupuesto.comercial}</span></div>
                            <div><span className="text-slate-400">Fecha Emisión:</span> <span className="text-slate-700">{presupuesto.fechaEmision}</span></div>
                            <div><span className="text-slate-400">Válido hasta:</span> <span className="font-semibold text-amber-700">{presupuesto.fechaValidez}</span></div>
                          </div>
                        )}
                      </div>

                    </div>

                    {/* Resumen rápido de puestos cotizados en Resumen */}
                    <div className="space-y-3 pt-2">
                      <div className="flex items-center justify-between">
                        <h4 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Perfiles Cotizados en esta Oferta</h4>
                        <button
                          onClick={() => setPestanaActiva('posiciones')}
                          className="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1"
                        >
                          Ver detalle y fórmulas <ChevronRight className="w-3.5 h-3.5" />
                        </button>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {calculosPosiciones.map(({ pos, eco }) => (
                          <div key={pos.id} className="border border-slate-200 rounded-xl p-4 bg-white hover:border-indigo-300 transition-all flex flex-col justify-between">
                            <div>
                              <div className="flex items-start justify-between gap-2">
                                <h5 className="font-bold text-slate-900 text-sm">{pos.nombre}</h5>
                                <span className="px-2 py-0.5 rounded text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">
                                  {eco.tarifaPVP.toFixed(2)} €/h
                                </span>
                              </div>
                              <p className="text-xs text-slate-500 mt-1 line-clamp-2">{pos.descripcionTareas || 'Sin descripción de tareas.'}</p>
                            </div>

                            <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                              <span className="text-slate-500">Jornada 8h: <strong className="text-slate-800">{eco.tarifaJornadaCalculada.toFixed(2)} €/día</strong></span>
                              {rolUsuario === 'direccion' && (
                                <span className="text-emerald-700 font-semibold bg-emerald-50 px-2 py-0.5 rounded">
                                  Margen: +{eco.margenEuroHora.toFixed(2)} €/h ({eco.margenPorcentaje.toFixed(1)}%)
                                </span>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* Observaciones comerciales */}
                    <div className="bg-slate-50 rounded-xl p-4 border border-slate-200">
                      <div className="text-xs font-bold text-slate-800 mb-2 flex items-center gap-1.5">
                        <FileText className="w-4 h-4 text-indigo-600" /> Observaciones y Cláusulas Comerciales Especiales
                      </div>
                      {modoEdicion ? (
                        <textarea
                          rows={3}
                          value={formularioPresupuesto.observacionesComerciales}
                          onChange={(e) => handleActualizarCampoPresupuesto('observacionesComerciales', e.target.value)}
                          className="w-full text-xs bg-white border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500"
                          placeholder="Añade cláusulas específicas de traspaso a plantilla, revisiones salariales o condiciones especiales..."
                        />
                      ) : (
                        <p className="text-xs text-slate-600 leading-relaxed">
                          {presupuesto.observacionesComerciales || 'Sin observaciones registradas.'}
                        </p>
                      )}
                    </div>

                  </div>
                )}

                {/* ----------------------------------------------------
                    PESTAÑA 2: POSICIONES COTIZADAS (EDITOR DINÁMICO)
                   ---------------------------------------------------- */}
                {pestanaActiva === 'posiciones' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200 gap-3">
                      <div>
                        <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Desglose de Posiciones & Perfiles ETT</h3>
                        <p className="text-xs text-slate-500">Configura salarios base, convenio, categoría profesional y calcula la tarifa por hora ofertada.</p>
                      </div>

                      <button
                        onClick={() => handleAbrirDrawerPosicion(null)}
                        className="px-3.5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow flex items-center gap-1.5 self-start transition-all"
                      >
                        <Plus className="w-4 h-4" />
                        Añadir posición
                      </button>
                    </div>

                    {/* Grid de tarjetas de posiciones editables */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                      {calculosPosiciones.map(({ pos, eco }) => (
                        <div
                          key={pos.id}
                          className="bg-white rounded-xl border border-slate-200 hover:border-indigo-200 shadow-xs p-5 transition-all flex flex-col justify-between"
                        >
                          <div>
                            {/* Cabecera de la tarjeta de posición */}
                            <div className="flex items-start justify-between gap-3 pb-3 border-b border-slate-100">
                              <div>
                                <div className="flex items-center gap-2">
                                  <h4 className="font-bold text-slate-900 text-base">{pos.nombre}</h4>
                                </div>
                                <div className="text-xs text-slate-500 mt-0.5">
                                  {CATALOGOS.convenios.find(c => c.id === pos.convenio)?.label || pos.convenioCustom || pos.convenio}
                                </div>
                              </div>

                              <div className="text-right">
                                <div className="text-lg font-bold text-indigo-700">{eco.tarifaPVP.toFixed(2)} €/h</div>
                                <div className="text-[11px] text-slate-500">{eco.tarifaJornadaCalculada.toFixed(2)} €/jornada</div>
                              </div>
                            </div>

                            {/* Desglose de Parámetros Laborales */}
                            <div className="grid grid-cols-3 gap-2 py-3.5 text-xs border-b border-slate-100 bg-slate-50/50 rounded-lg p-2.5 my-3">
                              <div>
                                <span className="text-slate-400 block text-[10px]">Salario Base Anual</span>
                                <span className="font-semibold text-slate-800">{Number(pos.salarioBaseAnual).toLocaleString('es-ES')} €</span>
                              </div>
                              <div>
                                <span className="text-slate-400 block text-[10px]">Plus Convenio/mes</span>
                                <span className="font-semibold text-slate-800">{Number(pos.plusConvenioMes).toFixed(2)} €</span>
                              </div>
                              <div>
                                <span className="text-slate-400 block text-[10px]">Salario Bruto/hora</span>
                                <span className="font-semibold text-slate-800">{eco.salarioBrutoHora.toFixed(2)} €/h</span>
                              </div>
                            </div>

                            {/* Comparativa Económica (Dirección vs Comercial) */}
                            {rolUsuario === 'direccion' ? (
                              <div className="space-y-2 py-1">
                                <div className="flex justify-between text-xs">
                                  <span className="text-slate-500">Coste Total Empresa ETT (Salario + SSSS + Otros):</span>
                                  <span className="font-semibold text-slate-700">{eco.costeTotalEmpresaHora.toFixed(2)} €/h</span>
                                </div>
                                <div className="flex justify-between text-xs">
                                  <span className="text-slate-500">Margen Neto ETT:</span>
                                  <span className="font-bold text-emerald-600">
                                    +{eco.margenEuroHora.toFixed(2)} €/h ({eco.margenPorcentaje.toFixed(1)}%)
                                  </span>
                                </div>
                                
                                {/* Barra visual de margen */}
                                <div className="w-full bg-slate-100 h-2 rounded-full overflow-hidden flex">
                                  <div style={{ width: `${(eco.salarioBrutoHora / eco.tarifaPVP) * 100}%` }} className="bg-sky-400" title="Salario Bruto" />
                                  <div style={{ width: `${(eco.totalCosteSocialHora / eco.tarifaPVP) * 100}%` }} className="bg-amber-400" title="Costes TGSS & Indemnización" />
                                  <div style={{ width: `${(eco.margenEuroHora / eco.tarifaPVP) * 100}%` }} className="bg-emerald-500" title="Margen ETT" />
                                </div>
                                <div className="flex justify-between text-[10px] text-slate-400 pt-0.5">
                                  <span>Salario: {((eco.salarioBrutoHora / eco.tarifaPVP) * 100).toFixed(0)}%</span>
                                  <span>Costes Sociales: {((eco.totalCosteSocialHora / eco.tarifaPVP) * 100).toFixed(0)}%</span>
                                  <span className="text-emerald-600 font-semibold">Margen: {eco.margenPorcentaje.toFixed(1)}%</span>
                                </div>
                              </div>
                            ) : (
                              <div className="py-2 text-xs text-slate-500 flex items-center justify-between bg-slate-50 px-3 py-2 rounded">
                                <span>Tarifa calculada conforme a convenio</span>
                                <span className="font-medium text-indigo-600">Tarifa PVP validada</span>
                              </div>
                            )}

                            {pos.descripcionTareas && (
                              <p className="text-xs text-slate-500 mt-3 pt-2 border-t border-slate-100 line-clamp-2">
                                <strong className="text-slate-700">Tareas:</strong> {pos.descripcionTareas}
                              </p>
                            )}
                          </div>

                          {/* Acciones de la posición */}
                          <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span className="text-[11px] text-slate-400">ID: {pos.id}</span>
                            <div className="flex items-center gap-1.5">
                              <button
                                onClick={() => handleDuplicarPosicion(pos)}
                                className="px-2.5 py-1 text-xs text-slate-700 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 rounded border border-slate-300 flex items-center gap-1 transition-colors"
                                title="Duplicar posición"
                              >
                                <Copy className="w-3 h-3" />
                                Duplicar
                              </button>
                              <button
                                onClick={() => handleAbrirDrawerPosicion(pos)}
                                className="px-2.5 py-1 text-xs text-indigo-700 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 rounded border border-indigo-200 flex items-center gap-1 font-semibold transition-colors"
                              >
                                <Edit3 className="w-3 h-3" />
                                Editar
                              </button>
                              <button
                                onClick={() => handleEliminarPosicion(pos.id)}
                                className="px-2 py-1 text-xs text-rose-600 hover:text-rose-800 hover:bg-rose-50 rounded border border-transparent hover:border-rose-200 transition-colors"
                                title="Eliminar posición"
                              >
                                <Trash2 className="w-3.5 h-3.5" />
                              </button>
                            </div>
                          </div>

                        </div>
                      ))}
                    </div>

                  </div>
                )}

                {/* ----------------------------------------------------
                    PESTAÑA 3: ESCANDALLO ECONÓMICO & COSTES
                   ---------------------------------------------------- */}
                {pestanaActiva === 'escandallo' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200 gap-3">
                      <div>
                        <div className="flex items-center gap-2">
                          <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Escandallo Económico & Conceptos de Coste</h3>
                          <span className="bg-indigo-100 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded">Fórmulas ETT</span>
                        </div>
                        <p className="text-xs text-slate-500">Estructura de costes sociales, indemnizaciones legales obligatorias y dotaciones de servicio.</p>
                      </div>

                      <button
                        onClick={() => handleAbrirDrawerConcepto(null)}
                        className="px-3.5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg shadow flex items-center gap-1.5 self-start"
                      >
                        <Plus className="w-4 h-4" />
                        Añadir concepto no obligatorio
                      </button>
                    </div>

                    {/* Tabla de conceptos de escandallo */}
                    <div className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-xs">
                      <table className="min-w-full divide-y divide-slate-200 text-left text-xs">
                        <thead className="bg-slate-50 font-semibold text-slate-700">
                          <tr>
                            <th className="px-4 py-3">Concepto Económico</th>
                            <th className="px-4 py-3">Tipo de Cálculo</th>
                            <th className="px-4 py-3">Valor / Coeficiente</th>
                            <th className="px-4 py-3">Base de Aplicación</th>
                            <th className="px-4 py-3">Naturaleza</th>
                            <th className="px-4 py-3 text-right">Acciones</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200 bg-white">
                          {datosActivos.conceptosEscandallo.map(c => (
                            <tr key={c.id} className="hover:bg-slate-50/80 transition-colors">
                              <td className="px-4 py-3.5">
                                <div className="font-semibold text-slate-900">{c.nombre}</div>
                                {c.descripcion && <div className="text-[11px] text-slate-500 mt-0.5">{c.descripcion}</div>}
                              </td>
                              <td className="px-4 py-3.5 text-slate-700">
                                {CATALOGOS.tiposConcepto.find(t => t.id === c.tipo)?.label || c.tipoCustom || c.tipo}
                              </td>
                              <td className="px-4 py-3.5 font-bold text-indigo-700">
                                {c.tipo === 'porcentaje' ? `${c.valor} %` : `${Number(c.valor).toFixed(2)} €`}
                              </td>
                              <td className="px-4 py-3.5 text-slate-600 text-[11px]">
                                {CATALOGOS.basesCalculo.find(b => b.id === c.baseCalculo)?.label || c.baseCalculoCustom || c.baseCalculo}
                              </td>
                              <td className="px-4 py-3.5">
                                {c.esObligatorioLegal ? (
                                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-semibold bg-rose-50 text-rose-700 border border-rose-200">
                                    <Lock className="w-3 h-3" /> Legal ETT (Bloqueado)
                                  </span>
                                ) : (
                                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] font-medium bg-slate-100 text-slate-700">
                                    Operativo / Opcional
                                  </span>
                                )}
                              </td>
                              <td className="px-4 py-3.5 text-right whitespace-nowrap">
                                <div className="flex items-center justify-end gap-1.5">
                                  <button
                                    onClick={() => handleAbrirDrawerConcepto(c)}
                                    className="p-1 text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded"
                                    title="Editar concepto"
                                  >
                                    <Edit3 className="w-3.5 h-3.5" />
                                  </button>
                                  {!c.esObligatorioLegal && (
                                    <button
                                      onClick={() => handleEliminarConcepto(c.id)}
                                      className="p-1 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded"
                                      title="Eliminar concepto"
                                    >
                                      <Trash2 className="w-3.5 h-3.5" />
                                    </button>
                                  )}
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    {/* Explicación de recálculo dinámico */}
                    <div className="bg-indigo-50/60 rounded-xl p-4 border border-indigo-100 flex items-start gap-3">
                      <Sparkles className="w-5 h-5 text-indigo-600 shrink-0 mt-0.5" />
                      <div className="text-xs text-indigo-950 space-y-1">
                        <strong className="font-semibold text-indigo-900 block">Recálculo automático y trazabilidad económica</strong>
                        <p className="text-slate-600">Cualquier modificación en los porcentajes o en los conceptos fijos por hora se traslada en tiempo real a todas las posiciones cotizadas, actualizando el coste empresa y recalculando el margen sin alterar la tarifa acordada con el cliente a menos que se ajuste manualmente.</p>
                      </div>
                    </div>

                  </div>
                )}

                {/* ----------------------------------------------------
                    PESTAÑA 4: CONDICIONES COMERCIALES (ESTRUCTURADO)
                   ---------------------------------------------------- */}
                {pestanaActiva === 'condiciones' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 border-b border-slate-200 gap-3">
                      <div>
                        <h3 className="text-sm font-bold text-slate-900 uppercase tracking-wider">Condiciones Contractuales & Forma de Pago</h3>
                        <p className="text-xs text-slate-500">Define los términos de facturación, plazos de garantía y cláusulas de servicio con catálogo normalizado.</p>
                      </div>
                      {!modoEdicion && presupuesto.esEditableDirecto && (
                        <button
                          onClick={handleIniciarEdicion}
                          className="px-3 py-1.5 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-lg border border-indigo-200 flex items-center gap-1.5"
                        >
                          <Edit3 className="w-3.5 h-3.5" /> Editar Condiciones
                        </button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      
                      {/* Forma de Pago */}
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                        <label className="text-xs font-bold text-slate-800 flex items-center gap-1.5">
                          <DollarSign className="w-4 h-4 text-indigo-600" /> Forma de Pago & Plazo de Facturación
                        </label>
                        
                        {modoEdicion ? (
                          <div className="space-y-2">
                            <select
                              value={formularioPresupuesto.formaPago}
                              onChange={(e) => handleActualizarCampoPresupuesto('formaPago', e.target.value)}
                              className="w-full text-xs bg-white border border-slate-300 rounded-md px-3 py-2 font-medium"
                            >
                              {CATALOGOS.formasPago.map(f => (
                                <option key={f.id} value={f.id}>{f.label}</option>
                              ))}
                            </select>

                            {formularioPresupuesto.formaPago === 'otro' && (
                              <input
                                type="text"
                                placeholder="Escribe la forma de pago personalizada..."
                                value={formularioPresupuesto.formaPagoCustom}
                                onChange={(e) => handleActualizarCampoPresupuesto('formaPagoCustom', e.target.value)}
                                className="w-full text-xs bg-white border border-amber-300 rounded-md px-3 py-1.5 mt-1 focus:ring-2 focus:ring-amber-500"
                              />
                            )}
                          </div>
                        ) : (
                          <div className="text-xs text-slate-700 bg-white p-3 rounded-lg border border-slate-200 font-medium">
